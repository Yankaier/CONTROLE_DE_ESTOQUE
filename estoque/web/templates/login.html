{% extends "base.html" %}{% block titulo %}Entrar · Controle de Estoque{% endblock %}
{% block acesso %}
<form class="card accent" method="post">{{ m.csrf_field() }}
  <div class="card-head"><div class="brand"><span class="brand-mark">{{ m.ic('caixa', 'lg') }}</span><span class="brand-text"><b>Almoxarifado</b><span>Controle de estoque</span></span></div></div>
  <div class="card-body">
    <div><h2>Entrar</h2><p class="hint">Acesso privado. Digite a sua senha.</p></div>
    {% if erro %}<div class="alert bad">{{ m.ic('erro') }}<span>{{ erro }}</span></div>{% endif %}
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" autofocus required></div>
    <button class="btn block">Entrar</button>
  </div>
</form>
{% endblock %}
