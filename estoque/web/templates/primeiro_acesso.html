{% extends "base.html" %}{% block titulo %}Primeiro acesso · Almoxarifado{% endblock %}
{% block conteudo %}
<form class="panel login-box" method="post">{{ m.csrf_field() }}
  <h2>Primeiro acesso</h2>
  <p class="hint">Crie a senha que vai proteger o app. Só quem souber essa senha entra.</p>
  {% if erro %}<div class="alert bad">{{ erro }}</div>{% endif %}
  <div class="field"><label for="nome">Seu nome (aparece na tela inicial)</label><input id="nome" name="nome" autocomplete="name"></div>
  <div class="field"><label for="senha">Senha (8 caracteres ou mais)</label><input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required></div>
  <div class="field"><label for="senha2">Repita a senha</label><input id="senha2" name="senha2" type="password" minlength="8" autocomplete="new-password" required></div>
  <button class="btn">Criar senha e entrar</button>
</form>
{% endblock %}
