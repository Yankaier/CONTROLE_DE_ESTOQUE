function Integracao({ db, mudar, avisar, baixar, setConfirmar, mcp, setDb, irPara, modo, assets, envioEst, setEnvioEst, enviarPlanilha, baixarPlanilha, nParaPlanilha }) {
  const [cfg, setCfg] = useState(db.integracao);
  const [estado, setEstado] = useState({ lendo: false, msg: "", tom: "", em: null });
  const [instr, setInstr] = useState(false);
  const watchRef = useRef(null);
  useEffect(() => () => watchRef.current && watchRef.current(), []);
  const salvarCfg = (c) => { setCfg(c); mudar((d) => { d.integracao = c; }); };
  const receber = useCallback((linhas, fonte) => {
    const { regs, faltando } = linhasParaRequisicoes(linhas, fonte);
    if (faltando.length) { setEstado((s) => ({ ...s, lendo: false, tom: "bad", msg: `Não achei as colunas: ${faltando.join(", ")}. Confira os títulos das perguntas.` })); return; }
    let novas = 0;
    mudar((d) => { const ja = new Set(d.requisicoes.map((r) => r.chave).filter(Boolean)); regs.forEach((r) => { if (!ja.has(r.chave)) { novaRequisicao(d, r); ja.add(r.chave); novas++; } }); });
    setEstado((s) => ({ ...s, lendo: false, tom: "ok", msg: `${regs.length} resposta(s) lida(s); ${novas} nova(s) requisição(ões).` }));
    if (novas) avisar(`${novas} requisição(ões) nova(s) do formulário.`);
  }, [mudar, avisar]);
  const erroMcp = (e) => {
    const c = e && e.code;
    const msg = { needs_reauth: "A conexão com o Google Sheets expirou. Reconecte em claude.ai ▸ Configurações ▸ Conectores.",
      server_not_connected: "O Google Sheets não está conectado. Adicione em claude.ai ▸ Configurações ▸ Conectores.",
      selection_required: "Há mais de uma conexão Google Sheets: escolha uma no aviso do claude.ai.",
      not_in_manifest: "Você não permitiu o Google Sheets para esta página. Libere em Permissões do artefato.",
      approval_required: "A leitura precisa da sua aprovação. Clique em Buscar respostas de novo e permita.",
      blocked_by_policy: "A sua organização bloqueia a leitura do Google Sheets aqui.",
      tool_error: "O Google Sheets recusou a leitura. Confira o ID da planilha e o nome da aba.",
      server_unavailable: "O Google Sheets não respondeu agora. Tente de novo em instantes." }[c] || "Não consegui ler a planilha agora. Use a importação de CSV enquanto isso.";
    setEstado((s) => ({ ...s, lendo: false, tom: "bad", msg }));
  };
  const range = () => `'${(cfg.aba || "Respostas ao formulário 1").replace(/'/g, "''")}'!A1:Z`;
  const buscar = async () => {
    const id = idDaPlanilha(cfg.planilha);
    if (!id) return setEstado({ lendo: false, tom: "bad", msg: "Cole o link ou o ID da planilha de respostas." });
    if (!mcp) return setEstado({ lendo: false, tom: "bad", msg: "A leitura direta do Google Sheets não está disponível nesta visualização. Use a importação de CSV." });
    setEstado({ lendo: true, tom: "", msg: "Lendo a planilha…" });
    try {
      const r = await mcp.callTool("Google Sheets", "get_values", { spreadsheetId: id, range: range() }, { cache: false });
      const v = valoresDaResposta(r.payload);
      if (!v) return setEstado({ lendo: false, tom: "bad", msg: "A planilha respondeu, mas não encontrei linhas. Confira o nome da aba." });
      setEstado((s) => ({ ...s, em: new Date() })); receber(v, "Google Sheets");
    } catch (e) { erroMcp(e); }
  };
  useEffect(() => {
    if (watchRef.current) { watchRef.current(); watchRef.current = null; }
    const id = idDaPlanilha(cfg.planilha);
    if (!cfg.auto || !mcp || !id) return;
    watchRef.current = mcp.watchTool("Google Sheets", "get_values", { spreadsheetId: id, range: range() }, (ev) => {
      if (ev.type === "data") { const v = valoresDaResposta(ev.result.payload); if (v) { setEstado((s) => ({ ...s, em: new Date(ev.result.cache?.storedAt || Date.now()) })); receber(v, "Google Sheets"); } }
      else erroMcp(ev.error);
    }, { refetchInterval: 120000 });
  }, [cfg.auto, cfg.planilha, cfg.aba, mcp]);

  const lerArquivo = (e, tipo) => {
    const arq = e.target.files && e.target.files[0]; e.target.value = "";
    if (!arq) return;
    const fr = new FileReader();
    fr.onload = () => {
      const texto = String(fr.result);
      if (tipo === "csv") return receber(csvLinhas(texto), "Importação CSV");
      try {
        const d = JSON.parse(texto);
        if (!d || !Array.isArray(d.itens) || !Array.isArray(d.movs) || !Array.isArray(d.operadores)) throw new Error();
        setConfirmar({ titulo: "Importar backup", perigo: true, botao: "Substituir dados",
          texto: `O backup tem ${d.itens.length} itens, ${d.operadores.length} operadores e ${d.movs.length} movimentações. Ele substitui todos os dados atuais. Se quiser guardar os dados atuais, exporte um backup antes.`,
          acao: () => { setDb(completar(d)); avisar("Backup importado."); } });
      } catch (_) { avisar("Esse arquivo não é um backup deste sistema (.json exportado aqui).", "bad"); }
    };
    fr.readAsText(arq, "utf-8");
  };
  const hoje = new Date().toISOString().slice(0, 10);
  const pend = useMemo(() => pendentesEnvio(db), [db]);
  const linhasEnv = useMemo(() => linhasPlanilha(db, pend), [db, pend]);
  const novosPl = useMemo(() => itensNovosPlanilha(db), [db]);
  const pl = db.planilha || {};
  const exportarJson = () => baixar(`backup-almoxarifado-${hoje}.json`, JSON.stringify({ ...db, exportadoEm: agora() }, null, 2));
  const exportarItens = () => baixar(`estoque-${hoje}.csv`, paraCsv([["SKU", "Item", "Categoria", "Unidade", "Local", "Saldo", "Mínimo", "Status", "Valor unit. (R$)", "Valor total (R$)"],
    ...db.itens.map((i) => [i.sku, i.nome, i.categoria, i.unidade, i.local, String(i.qtd).replace(".", ","), String(i.minimo).replace(".", ","), statusItem(i), i.valor.toFixed(2).replace(".", ","), (i.qtd * i.valor).toFixed(2).replace(".", ",")])]));
  const copiar = (t, msg) => navigator.clipboard?.writeText(t).then(() => avisar(msg || "Copiado.")).catch(() => avisar("Não consegui copiar: selecione e use Ctrl+C.", "warn"));

  return html`
  <section><p class="lbl m-0" style=${{ color: "rgb(var(--accent-ink))" }}>Conexões</p><h2 class="font-display text-3xl font-bold m-0">Integração e backup</h2></section>
  <div class="grid gap-5 lg:grid-cols-2 items-start">
    <section class="card overflow-hidden">
      <div class="px-5 py-4 border-b border-line flex items-start justify-between gap-3"><div><h3 class="font-display text-xl font-bold uppercase tracking-wide m-0 flex items-center gap-2"><${Ic} n="ClipboardList" size=${19} /> 1. Perguntas do formulário</h3>
        <p class="m-0 mt-1 text-sm text-muted">Crie o formulário com estes títulos. O app reconhece as colunas pelo nome (variações como "ID do operador" ou "Qtd" também servem).</p></div>
        <button class="btn btn-ghost btn-sm shrink-0" onClick=${() => copiar(CAMPOS_FORM.map((c) => c[0]).join("\n"), "Títulos das perguntas copiados.")}><${Ic} n="Copy" size=${14} /> Copiar</button></div>
      <div class="scroll-x"><table class="grid-t"><thead><tr><th>Pergunta (título exato)</th><th>Tipo</th><th>Exemplo</th></tr></thead>
        <tbody>${CAMPOS_FORM.map((c) => html`<tr key=${c[0]}><td class="font-semibold">${c[0]}</td><td class="text-sm text-muted">${c[1]}</td><td class="font-mono text-sm">${c[2]}</td></tr>`)}
        <tr><td class="text-muted">Carimbo de data/hora</td><td class="text-sm text-muted" colspan="2">Criado sozinho pelo Google Forms; evita importar a mesma resposta duas vezes.</td></tr></tbody></table></div>
      <div class="px-5 py-3 border-t border-line bg-surface2 flex flex-wrap gap-2"><button class="btn btn-ghost" onClick=${() => setInstr(true)}><${Ic} n="Info" size=${16} /> Instruções técnicas (Forms, Tally, Make/Zapier, Apps Script)</button></div>
    </section>

    <section class="card overflow-hidden">
      <div class="px-5 py-4 border-b border-line"><h3 class="font-display text-xl font-bold uppercase tracking-wide m-0 flex items-center gap-2"><${Ic} n="FileSpreadsheet" size=${19} /> 2. Ler respostas da planilha</h3>
        <p class="m-0 mt-1 text-sm text-muted">O Google Forms (e o Tally, pela integração dele) grava as respostas numa planilha Google. Esta página lê essa planilha pela sua conexão Google Sheets do claude.ai.</p></div>
      <div class="p-5 flex flex-col gap-3">
        ${mcp === null ? html`<p class="m-0 text-sm p-3 rounded-lg bg-warn-soft text-warn">A leitura direta não está disponível nesta visualização (fora do claude.ai ou sem a conexão Google Sheets). Use a importação de CSV abaixo.</p>` : null}
        <${Campo} id="gs-id" rotulo="Link ou ID da planilha de respostas"><input id="gs-id" class="inp font-mono text-sm" value=${cfg.planilha} onInput=${(e) => setCfg({ ...cfg, planilha: e.target.value })} onBlur=${() => salvarCfg(cfg)} placeholder="https://docs.google.com/spreadsheets/d/…" /><//>
        <${Campo} id="gs-aba" rotulo="Nome da aba" dica='Google Forms cria "Respostas ao formulário 1". Com o Apps Script, use "Requisicoes".'><input id="gs-aba" class="inp" value=${cfg.aba} onInput=${(e) => setCfg({ ...cfg, aba: e.target.value })} onBlur=${() => salvarCfg(cfg)} /><//>
        <label class="flex items-center gap-2 text-sm font-semibold cursor-pointer"><input type="checkbox" checked=${!!cfg.auto} onChange=${(e) => salvarCfg({ ...cfg, auto: e.target.checked })} disabled=${!mcp} /> Verificar novas respostas a cada 2 minutos enquanto esta página estiver aberta</label>
        <div class="flex flex-wrap gap-2 items-center"><button class="btn" onClick=${() => { salvarCfg(cfg); buscar(); }} disabled=${estado.lendo || mcp === null}><${Ic} n="RefreshCw" size=${16} className=${estado.lendo ? "animate-spin" : ""} /> Buscar respostas agora</button>
          ${estado.em ? html`<span class="text-xs text-muted">Última leitura: ${estado.em.toLocaleTimeString("pt-BR")}</span>` : null}</div>
        ${estado.msg ? html`<p role="status" class=${"m-0 text-sm p-3 rounded-lg " + (estado.tom === "bad" ? "bg-bad-soft text-bad" : estado.tom === "ok" ? "bg-good-soft text-good" : "bg-surface2 text-muted")}>${estado.msg}${estado.tom === "ok" ? html` <button class="underline font-semibold" style=${{ background: "none", border: 0, color: "inherit", cursor: "pointer" }} onClick=${() => irPara("requisicoes")}>Ver requisições</button>` : null}</p>` : null}
        <div class="border-t border-dashed border-line pt-3 flex flex-col gap-2">
          <span class="lbl">Ou importe um arquivo</span>
          <p class="m-0 text-sm text-muted">CSV exportado do Google Forms, Tally, Typeform ou Jotform. Respostas já importadas não entram de novo.</p>
          <label class="btn btn-ghost w-fit cursor-pointer relative"><${Ic} n="Upload" size=${16} /> Importar respostas (.csv)<input type="file" accept=".csv,text/csv" class="sr-only" style=${{ position: "absolute", width: 1, height: 1, opacity: 0 }} onChange=${(e) => lerArquivo(e, "csv")} /></label>
        </div>
      </div>
    </section>

    <section class="card overflow-hidden lg:col-span-2">
      <div class="px-5 py-4 border-b border-line"><h3 class="font-display text-xl font-bold uppercase tracking-wide m-0 flex items-center gap-2"><${Ic} n="Database" size=${19} /> 3. Banco de dados e backup</h3>
        <p class="m-0 mt-1 text-sm text-muted">${modo === "local"
          ? "Aberto fora do claude.ai: os dados ficam só neste navegador. Exporte um backup de vez em quando."
          : "Os dados ficam no banco deste app, no claude.ai: os mesmos no celular e no notebook, para quem tiver acesso ao link. Exporte um backup de vez em quando."}</p></div>
      ${db.importacao ? html`<div class="mx-5 mt-4 p-3 rounded-lg bg-info-soft text-info text-sm flex gap-2 items-start"><${Ic} n="ClipboardList" size=${16} className="mt-0.5 shrink-0" />
        <span>Base copiada de <b>${db.importacao.origem}</b> em ${dataHora(db.importacao.em)}${db.importacao.ate ? ` (lançamentos até ${db.importacao.ate})` : ""}: ${db.importacao.itens} itens, ${db.importacao.operadores} operadores e ${db.importacao.movs} movimentações.
        Para recarregar a base, peça ao Claude: <i>"use a planilha oficial como base de novo"</i>.</span></div>` : null}
      <div class="p-5 grid gap-3" style=${{ gridTemplateColumns: "repeat(auto-fit, minmax(230px, 1fr))" }}>
        <button class="btn" onClick=${exportarJson}><${Ic} n="FileJson" size=${16} /> Exportar backup (JSON)</button>
        <button class="btn btn-ghost" onClick=${exportarItens}><${Ic} n="FileSpreadsheet" size=${16} /> Exportar estoque (CSV)</button>
        <label class="btn btn-ghost cursor-pointer relative"><${Ic} n="Upload" size=${16} /> Importar backup (JSON)<input type="file" accept=".json,application/json" style=${{ position: "absolute", width: 1, height: 1, opacity: 0 }} onChange=${(e) => lerArquivo(e, "json")} /></label>
        <button class="btn btn-ghost" onClick=${() => setConfirmar({ titulo: "Apagar todos os dados", perigo: true, botao: "Apagar tudo",
            texto: `Apagar ${db.itens.length} itens, ${db.operadores.length} operadores, ${db.movs.length} movimentações e ${db.requisicoes.length} requisições${modo === "local" ? " deste navegador" : " do banco de dados, em todos os aparelhos"}? Exporte um backup antes se quiser guardar.`,
            acao: () => { setDb({ ...vazio(), integracao: db.integracao, planilha: db.planilha }); avisar("Todos os dados foram apagados."); } })}><${Ic} n="Trash2" size=${16} className="text-bad" /> Apagar todos os dados</button>
      </div>
    </section>
    <section class="card overflow-hidden lg:col-span-2">
      <div class="px-5 py-4 border-b border-line"><h3 class="font-display text-xl font-bold uppercase tracking-wide m-0 flex items-center gap-2"><${Ic} n="FileSpreadsheet" size=${19} /> 4. Planilha oficial (SharePoint)</h3>
        <p class="m-0 mt-1 text-sm text-muted">Cada entrada e saída registrada aqui é gravada sozinha na aba <b>Movimentação</b> do ${pl.arquivo || "CONTROLE DE ESTOQUES 2.0.xlsx"}, alguns segundos depois do registro, com uma linha por serial e a formatação da planilha preservada. Itens novos, correções de item e exclusões vão para a aba <b>Contagem</b>, e os descartes para a aba <b>DESCARTES</b>. A cada 5 minutos (e ao abrir) o site também confere a planilha: o que for lançado ou corrigido direto no Excel aparece aqui.</p></div>
      <div class="p-5 flex flex-col gap-4">
        <div class="grid gap-3" style=${{ gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))" }}>
          <div><span class="lbl block">Esperando envio</span><span class="font-display text-4xl font-bold num">${nParaPlanilha}</span><span class="text-sm text-muted"> ${[`${pend.length} lançamento(s) · ${linhasEnv.length} linha(s)`, novosPl.length && `${novosPl.length} item(ns) novo(s)`, cadastrosPend(db).length && `${cadastrosPend(db).length} correção(ões) de item`, removerPend(db).length && `${removerPend(db).length} exclusão(ões)`, descartesPend(db).length && `${descartesPend(db).length} descarte(s)`].filter(Boolean).join(" · ")}</span></div>
          <div><span class="lbl block">Último envio</span><span class="font-semibold">${pl.sharepointEm ? dataHora(pl.sharepointEm) : "—"}</span>${pl.lidoEm ? html`<span class="block text-xs text-muted">Conferida em ${dataHora(pl.lidoEm)}</span>` : null}</div>
          <div><span class="lbl block">Última linha gravada</span><span class="font-semibold num">${pl.ultimaLinha || "—"}</span></div>
        </div>
        ${!pl.assetId ? html`<p class="m-0 text-sm p-3 rounded-lg bg-warn-soft text-warn">O site ainda não tem a cópia da planilha para editar. Peça ao Claude: <i>"recarregue a cópia da planilha no site"</i>.</p>` : null}
        ${mcp === null || assets === null ? html`<p class="m-0 text-sm p-3 rounded-lg bg-warn-soft text-warn">O envio automático só funciona com o site aberto no claude.ai, com o Microsoft 365 conectado. Aqui os registros ficam guardados e são enviados quando o site for aberto lá.</p>` : null}
        ${envioEst.msg ? html`<p role="status" class=${"m-0 text-sm p-3 rounded-lg " + (envioEst.tom === "bad" ? "bg-bad-soft text-bad" : envioEst.tom === "ok" ? "bg-good-soft text-good" : envioEst.tom === "warn" ? "bg-warn-soft text-warn" : "bg-surface2 text-muted")}>${envioEst.msg}</p>` : null}
        ${envioEst.status === "conflito" ? html`<div class="p-3 rounded-lg border border-line flex flex-col gap-2 text-sm">
          <p class="m-0">Corrija no Excel o que o aviso aponta e toque em <b>Conferir de novo</b>. Se precisar, peça ao Claude: <i>"junte o que mudou na planilha com o site"</i>.</p>
          <p class="m-0 text-muted">Se você tem certeza de que o que mudou por fora pode ser descartado, use Enviar mesmo assim: o arquivo do SharePoint volta a ser o do site com os registros novos (o SharePoint guarda a versão anterior no histórico).</p>
          <div class="flex flex-wrap gap-2"><button class="btn" onClick=${() => { setEnvioEst({ status: "", msg: "", tom: "" }); enviarPlanilha(); }}><${Ic} n="RefreshCw" size=${16} /> Conferir de novo</button><button class="btn btn-ghost" onClick=${() => setConfirmar({ titulo: "Enviar mesmo assim", perigo: true, botao: "Substituir a planilha",
              texto: "O que foi gravado na planilha por fora do site desde o último envio vai sumir do arquivo (fica só no histórico de versões do SharePoint). Continuar?",
              acao: () => { setEnvioEst({ status: "", msg: "", tom: "" }); enviarPlanilha({ forcar: true }); } })}><${Ic} n="TriangleAlert" size=${16} className="text-bad" /> Enviar mesmo assim</button></div></div>` : null}
        <div class="flex flex-wrap gap-2">
          <button class="btn" disabled=${envioEst.status === "enviando" || envioEst.status === "conflito" || !mcp || !assets || !pl.assetId} onClick=${() => { setEnvioEst({ status: "", msg: "", tom: "" }); enviarPlanilha(); }}><${Ic} n=${nParaPlanilha ? "Send" : "RefreshCw"} size=${16} /> ${nParaPlanilha ? "Enviar agora" : "Conferir a planilha agora"}</button>
          <button class="btn btn-ghost" disabled=${!pl.assetId} onClick=${baixarPlanilha} title="Baixa a planilha com os registros que ainda não foram enviados (não marca nada como enviado)"><${Ic} n="FileSpreadsheet" size=${16} /> Baixar .xlsx</button>
        </div>
        ${linhasEnv.length ? html`<div class="scroll-x border border-line rounded-lg"><table class="grid-t text-sm"><thead><tr>${COLS_PLANILHA.map((c) => html`<th key=${c}>${c}</th>`)}</tr></thead>
          <tbody>${linhasEnv.slice(0, 8).map((l, i) => html`<tr key=${i}>${l.map((c, j) => html`<td key=${j} class=${j === 8 ? "num" : ""}>${c}</td>`)}</tr>`)}</tbody></table>
          ${linhasEnv.length > 8 ? html`<p class="m-0 px-3 py-2 text-xs text-muted">…e mais ${linhasEnv.length - 8} linha(s).</p>` : null}</div>`
          : html`<p class="m-0 text-sm text-muted">Tudo o que foi registrado aqui já está na planilha.</p>`}
      </div>
    </section>
  </div>
  ${instr ? html`<${Modal} titulo="Conectar o formulário" onClose=${() => setInstr(false)} largo=${true}>
    <p class="m-0 text-sm">Esta página não tem um endereço público para receber webhooks. O caminho é sempre o mesmo: <b>o formulário grava numa planilha Google</b> e o app lê a planilha (botão "Buscar respostas" ou verificação a cada 2 minutos). Escolha a ferramenta:</p>
    <div class="grid gap-3 sm:grid-cols-2">
      <div class="p-4 rounded-lg border border-line"><h4 class="font-display text-lg font-bold m-0">Google Forms</h4><ol class="m-0 mt-2 pl-5 text-sm flex flex-col gap-1">
        <li>Crie as perguntas com os títulos da tabela 1.</li><li>Aba <b>Respostas ▸ Vincular ao Planilhas</b> ▸ criar planilha.</li><li>Copie o link da planilha e cole no campo 2.</li></ol></div>
      <div class="p-4 rounded-lg border border-line"><h4 class="font-display text-lg font-bold m-0">Tally</h4><ol class="m-0 mt-2 pl-5 text-sm flex flex-col gap-1">
        <li>Crie o formulário com os mesmos títulos.</li><li><b>Integrations ▸ Google Sheets ▸ Connect</b>.</li><li>Cole o link da planilha criada no campo 2 (aba "Sheet1" ou a que o Tally criar).</li></ol></div>
      <div class="p-4 rounded-lg border border-line"><h4 class="font-display text-lg font-bold m-0">Typeform, Jotform ou webhook (Make / Zapier)</h4><ol class="m-0 mt-2 pl-5 text-sm flex flex-col gap-1">
        <li>Gatilho: <b>New submission</b> (ou "Custom webhook" se o seu formulário só envia webhook).</li><li>Ação: <b>Google Sheets ▸ Add row</b>, mapeando cada resposta para as colunas da tabela 1.</li><li>Cole o link dessa planilha no campo 2.</li></ol></div>
      <div class="p-4 rounded-lg border border-line"><h4 class="font-display text-lg font-bold m-0">Sem internet no meio</h4><ol class="m-0 mt-2 pl-5 text-sm flex flex-col gap-1">
        <li>Exporte as respostas em CSV na ferramenta do formulário.</li><li>Use <b>Importar respostas (.csv)</b>.</li><li>Repetidas são ignoradas.</li></ol></div>
    </div>
    <div class="flex flex-col gap-2"><div class="flex items-center justify-between gap-2"><h4 class="font-display text-lg font-bold m-0">Opcional: Google Apps Script para padronizar as colunas</h4>
      <button class="btn btn-ghost btn-sm" onClick=${() => copiar(APPS_SCRIPT, "Script copiado.")}><${Ic} n="Copy" size=${14} /> Copiar script</button></div>
      <pre class="code m-0">${APPS_SCRIPT}</pre>
      <p class="m-0 text-xs text-muted">Útil quando as perguntas do formulário têm outros títulos: ajuste os nomes dentro de v("…") e aponte o app para a aba "Requisicoes".</p></div>
  <//>` : null}`;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
