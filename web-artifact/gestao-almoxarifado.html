        dbRef.current = { ...dbRef.current, seq: { mov: 0, req: 0, ...(c.seq || {}) }, integracao: { ...vazio().integracao, ...(c.integracao || {}) }, importacao: c.importacao || null, envio: c.envio || null, planilha: c.planilha || null };
        setDb(dbRef.current); pronto("config", snap);
      }, erro));
    });
    return () => { clearTimeout(timer); fim.forEach((f) => f()); };
  }, []);
  useEffect(() => { const f = () => { const h = location.hash.slice(1); if (h) setAba(h); }; window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  useEffect(() => { usar("downloads").then(setDownloads); usar("mcp").then((m) => setMcp(m || null)); usar("assets").then((a) => setAssets(a || null)); }, []);

  const irPara = (a) => { setAba(a); try { history.replaceState(null, "", "#" + a); } catch (_) { location.hash = a; } window.scrollTo({ top: 0, behavior: "smooth" }); };
  const avisar = useCallback((texto, tom = "ok") => { const id = uid("t"); setToasts((t) => [...t, { id, texto, tom }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4800); }, []);
  const substituir = useCallback((novo) => {
    const antes = dbRef.current; dbRef.current = novo; setDb(novo);
    if (banco.current) gravarDiferencas(banco.current, antes, novo).catch((e) => avisar(erroBanco(e), "bad"));
    else setArmazenamento(salvarLocal(novo));
  }, [avisar]);
  /* toda mudança passa por aqui: copia o estado atual, aplica e só grava se não deu erro */
  const mudar = useCallback((fn, msg) => {
    const c = JSON.parse(JSON.stringify(dbRef.current));
    let ret;
    try { ret = fn(c); } catch (e) { avisar(e.message, "bad"); return false; }
    substituir(c);
    if (msg) avisar(typeof msg === "function" ? msg(ret) : msg);
    return true;
  }, [avisar, substituir]);
  const mudarRef = useRef(mudar); mudarRef.current = mudar;

  /* planilha oficial: um aparelho por vez; junta o que foi feito no Excel e envia o que está pendente; o resultado vai para o banco */
  const envioRef = useRef(envioEst); envioRef.current = envioEst;
  const enviarPlanilha = useCallback(async (opts = {}) => {
    if (enviandoRef.current) return;
    if (opts.silencioso && envioRef.current.status === "parado") return;
    const p0 = dbRef.current.planilha || {};
    if (!p0.assetId) return;
    if (!opts.forcar && p0.enviandoEm && p0.enviandoPor !== APARELHO && Date.now() - new Date(p0.enviandoEm).getTime() < 120000) {
      if (!opts.silencioso) setEnvioEst({ status: "erro", msg: "Outro aparelho está enviando à planilha agora. Este tenta de novo em seguida.", tom: "warn" });
      return;
    }
    const pendente = contarPendencias(dbRef.current) > 0;
    enviandoRef.current = true;
    if (pendente || !opts.silencioso) setEnvioEst({ status: "enviando", msg: pendente ? "Enviando ao SharePoint…" : "Conferindo a planilha…", tom: "" });
    if (pendente) mudarRef.current((d) => { d.planilha = { ...ALVO_PADRAO, ...(d.planilha || {}), enviandoEm: agora(), enviandoPor: APARELHO }; });
    try {
      const r = await sincronizarPlanilha(dbRef.current, mcp, assets, opts);
      if (!r) {
        if (pendente) mudarRef.current((d) => { d.planilha = { ...(d.planilha || {}), enviandoEm: null, enviandoPor: null }; });
        setEnvioEst((e) => (!opts.silencioso || e.status === "erro" || e.status === "enviando" || e.status === "conflito") ? { status: "ok", msg: opts.silencioso ? "" : "A planilha já está em dia.", tom: "ok" } : e);
        return;
      }
      mudarRef.current((d) => {
        if (r.mescla) aplicarMescla(d, r.mescla);
        const p = { ...ALVO_PADRAO, ...(d.planilha || {}), assetId: r.assetId, spBytes: r.spBytes, lidoEm: agora(), enviandoEm: null, enviandoPor: null };
        if (r.enviou) {
          const rows = r.out.rows, linhaDe = {};
          for (const [id, [k, n]] of Object.entries(r.offs)) linhaDe[id] = rows.slice(k, k + n);
          d.movs.forEach((m) => { if (linhaDe[m.id]) m.linhasPlanilha = linhaDe[m.id]; });
          const novosIds = new Set(r.novos.map((i) => i.id)), cadIds = new Set(r.cads.map((i) => i.id));
          d.itens.forEach((i) => { if (novosIds.has(i.id)) i.naPlanilha = true; if (cadIds.has(i.id)) delete i.correcaoPlanilha; });
          const descIds = new Set(r.descPend.map((x) => x.id));
          (d.descartes || []).forEach((x) => { if (r.baixas[x.id]) x.baixa = r.baixas[x.id]; if (descIds.has(x.id)) x.naPlanilha = true; });
          const enviados = new Set(r.remover.map(chaveVals));
          p.remover = (p.remover || []).filter((x) => !enviados.has(chaveVals(x)));
          p.enviadoAte = Math.max(enviadoAte(d), ...r.pend.map((m) => m.n || 0));
          p.ultimaLinha = rows.length ? rows[rows.length - 1] : p.ultimaLinha || null;
          p.sharepointEm = agora();
        }
        d.planilha = p;
      });
      const partes = [];
      if (r.mescla) { const t = resumoMescla(r.mescla); if (t) partes.push("Trouxe do Excel: " + t + "."); if (r.mescla.itensNovos.length) partes.push("Confira os itens novos que vieram do Excel: podem ser erro de digitação."); }
      if (r.enviou) {
        const rows = r.out.rows, o = [];
        if (r.movements.length) o.push(`${r.movements.length} linha(s) na Movimentação (${intervalo(rows)})`);
        if (r.novos.length) o.push(`${r.novos.length} item(ns) novo(s) na Contagem`);
        if (r.cads.length) o.push(`${r.cads.length} correção(ões) de cadastro`);
        if (r.remover.length) o.push(`${r.remover.length} item(ns) tirado(s) da Contagem`);
        if (r.descPend.length) o.push(`${r.descPend.length} descarte(s)`);
        partes.unshift("Gravado no SharePoint: " + o.join(", ") + ".");
      }
      setEnvioEst({ status: "ok", tom: "ok", msg: partes.join(" ") });
    } catch (e) {
      console.error("envio planilha", e);
      if (pendente) mudarRef.current((d) => { d.planilha = { ...(d.planilha || {}), enviandoEm: null, enviandoPor: null }; });
      if (e && e.code === "conflito") setEnvioEst({ status: "conflito", tom: "bad", msg: "A planilha foi mexida no Excel de um jeito que o site não consegue juntar sozinho: " + e.motivo + " Enquanto isso, o site guarda os registros e não envia, para não apagar nada." });
      else if (!opts.silencioso || pendente) setEnvioEst({ status: REENVIAVEL(e) ? "erro" : "parado", tom: REENVIAVEL(e) ? "warn" : "bad", msg: erroPlanilha(e) });
    } finally { enviandoRef.current = false; }
  }, [mcp, assets]);
  const nParaPlanilha = useMemo(() => contarPendencias(db), [db]);
  const temMestra = !!(db.planilha && db.planilha.assetId);
  /* envia sozinho alguns segundos depois de cada registro; se falhou por algo passageiro, tenta de novo em 3 minutos */
  useEffect(() => {
    if (!nParaPlanilha || modo !== "nuvem" || !mcp || !assets || !temMestra) return;
    if (["conflito", "parado", "enviando"].includes(envioEst.status)) return;
    const t = setTimeout(() => enviarPlanilha(), envioEst.status === "erro" ? 180000 : 4000);
    return () => clearTimeout(t);
  }, [nParaPlanilha, modo, mcp, assets, envioEst.status, temMestra, enviarPlanilha]);
  /* confere a planilha ao abrir e a cada 5 minutos: o que for lançado no Excel aparece aqui */
  useEffect(() => {
    if (modo !== "nuvem" || !mcp || !assets || !temMestra) return;
    const t0 = setTimeout(() => enviarPlanilha({ silencioso: true }), 6000);
    const t = setInterval(() => { if (!document.hidden) enviarPlanilha({ silencioso: true }); }, 300000);
    return () => { clearTimeout(t0); clearInterval(t); };
  }, [modo, mcp, assets, temMestra, enviarPlanilha]);
  const baixarPlanilha = async () => {
    try {
      const m = await montarPlanilha(dbRef.current);
      const nome = (m.cfg.arquivo || "CONTROLE DE ESTOQUES 2.0.xlsx").replace(/\.xlsx$/i, "") + " (com pendentes do site).xlsx";
      if (downloads) { try { await downloads.save({ filename: nome, data: m.out.bytes }); avisar(`${nome} salvo.`); return; } catch (e) { if (e && e.code === "declined") return avisar("Download cancelado.", "warn"); } }
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([m.out.bytes])); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { avisar(erroPlanilha(e), "bad"); }
  };

  const baixar = async (nome, conteudo) => {
    if (downloads) {
      try { await downloads.save({ filename: nome, data: conteudo }); avisar(`${nome} salvo.`); return; }
      catch (e) { if (e && e.code === "declined") { avisar("Download cancelado.", "warn"); return; } }
    }
    setTextoSaida({ nome, conteudo: String(conteudo).replace(/^﻿/, "") });
  };

  const kpi = useMemo(() => {
    const valor = db.itens.reduce((s, i) => s + i.qtd * i.valor, 0);
    const baixo = db.itens.filter((i) => statusItem(i) === "Baixo").length;
    const esg = db.itens.filter((i) => statusItem(i) === "Esgotado").length;
    const pend = db.requisicoes.filter((r) => r.status === "Pendente").length;
    return { valor, baixo, esg, pend, unidades: db.itens.reduce((s, i) => s + i.qtd, 0) };
  }, [db]);

  const destinos = useMemo(() => [...new Set([...DESTINOS_BASE, ...db.movs.map((m) => m.destino).filter(Boolean), ...db.requisicoes.map((r) => r.destino).filter(Boolean)])], [db]);
  const ABAS = [["estoque", "Estoque", "Boxes"], ["movimentar", "Movimentar", "ArrowUpDown"], ["historico", "Histórico", "History"], ["descartes", "Descartes", "Recycle"],
    ["requisicoes", "Requisições", "ClipboardList", kpi.pend], ["operadores", "Operadores", "UserCheck"], ["integracao", "Integração e backup", "PlugZap"]];
  const ctx = { db, mudar, avisar, irPara, setConfirmar, baixar, destinos, mcp, downloads, setPreMov, preMov, modo, assets, envioEst, setEnvioEst, enviarPlanilha, baixarPlanilha, nParaPlanilha };

  return html`
  <header class="gutter relative overflow-hidden" style=${{ background: "rgb(var(--band))", color: "rgb(var(--band-ink))", marginTop: "calc(-1 * env(safe-area-inset-top, 0px))", paddingTop: "calc(env(safe-area-inset-top, 0px) + 22px)", paddingBottom: "22px" }}>
    <div class="absolute right-0 top-0 bottom-0 w-3 stripe" aria-hidden="true"></div>
    <div class="max-w-7xl mx-auto flex flex-col gap-4 pr-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="grid place-items-center w-11 h-11 rounded-lg stripe shrink-0"><span class="grid place-items-center w-8 h-8 rounded-md bg-accent text-[#1b232a]"><${Ic} n="Package" size=${20} /></span></span>
          <div><h1 class="font-display text-3xl font-bold leading-none m-0">Gestão do Almoxarifado</h1>
          <p class="m-0 mt-1 text-sm" style=${{ color: "rgb(var(--band-muted))" }}>Estoque, entradas, saídas e descartes, gravados sozinhos na planilha oficial do SharePoint.</p></div>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
          ${(() => { const st = { nuvem: ["chip-ok", "Database", "Banco de dados na nuvem", "Salvo no banco deste app: o mesmo no celular e no notebook"],
              conectando: ["chip-plain", "RefreshCw", "Conectando ao banco…", "Buscando os dados"],
              lento: ["chip-warn", "TriangleAlert", "Banco sem resposta", "Os dados podem estar desatualizados; confira a internet"],
              erro: ["chip-bad", "CircleX", "Banco indisponível", "Recarregue a página"],
              local: armazenamento ? ["chip-warn", "TriangleAlert", "Salvo só neste navegador", "Aberto fora do claude.ai: os dados ficam só neste navegador"] : ["chip-bad", "TriangleAlert", "Sem salvamento", "Este navegador não está guardando os dados: exporte um backup"] }[modo];
            return html`<span class=${"chip " + st[0]} title=${st[3]}><${Ic} n=${st[1]} size=${12} /> ${st[2]}</span>`; })()}
          ${modo !== "local" ? (() => { const e = envioEst.status;
              const st = e === "enviando" ? ["chip-plain", "RefreshCw", "Enviando à planilha…"] : e === "conflito" ? ["chip-bad", "TriangleAlert", "Planilha alterada por fora"]
                : e === "parado" ? ["chip-bad", "TriangleAlert", "Envio à planilha parado"] : nParaPlanilha ? ["chip-warn", "FileSpreadsheet", `${nParaPlanilha} para a planilha`] : ["chip-ok", "FileSpreadsheet", "Planilha em dia"];
              return html`<button type="button" class=${"chip " + st[0]} style=${{ border: 0, cursor: "pointer" }} title="Ver o envio à planilha oficial" onClick=${() => irPara("integracao")}><${Ic} n=${st[1]} size=${12} className=${e === "enviando" ? "animate-spin" : ""} /> ${st[2]}</button>`; })() : null}
        </div>
      </div>
      <div class="grid gap-3" style=${{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 160px), 1fr))" }}>
        <${Kpi} icone="Banknote" valor=${brl(kpi.valor)} rotulo="Valor total em estoque" tom="accent" onClick=${() => irPara("estoque")} />
        <${Kpi} icone="Boxes" valor=${db.itens.length} rotulo="Itens cadastrados" sub=${qtdFmt(kpi.unidades) + " unidades"} tom="info" onClick=${() => irPara("estoque")} />
        <${Kpi} icone="TriangleAlert" valor=${kpi.baixo + kpi.esg} rotulo="Alertas de estoque" sub=${`${kpi.baixo} baixo · ${kpi.esg} esgotado`} tom=${kpi.baixo + kpi.esg ? "warn" : "ok"} onClick=${() => irPara("estoque")} />
        <${Kpi} icone="ClipboardList" valor=${kpi.pend} rotulo="Requisições pendentes" tom=${kpi.pend ? "bad" : "ok"} onClick=${() => irPara("requisicoes")} />
      </div>
    </div>
  </header>
  <nav class="navbar gutter" aria-label="Áreas">
    <div class="max-w-7xl mx-auto flex overflow-x-auto tabs">
      ${ABAS.map(([k, n, ic, b]) => html`<a key=${k} href=${"#" + k} class="tab" aria-current=${aba === k ? "page" : undefined} onClick=${(e) => { e.preventDefault(); irPara(k); }}>
        <${Ic} n=${ic} size=${17} />${n}${b ? html`<span class="badge">${b}</span>` : null}</a>`)}
    </div>
  </nav>
  <main class="gutter" style=${{ paddingBlock: "24px 56px" }}>
    <div class="max-w-7xl mx-auto flex flex-col gap-5">
      ${!carregado ? html`<div class="card"><${Vazio} icone="Database" texto="Carregando o estoque do banco de dados…" /></div>` : null}
      ${carregado && aba === "estoque" ? html`<${Estoque} ...${ctx} />` : null}
      ${carregado && aba === "movimentar" ? html`<${Movimentar} ...${ctx} />` : null}
      ${carregado && aba === "historico" ? html`<${Historico} ...${ctx} />` : null}
      ${carregado && aba === "descartes" ? html`<${Descartes} ...${ctx} />` : null}
      ${carregado && aba === "requisicoes" ? html`<${Requisicoes} ...${ctx} />` : null}
      ${carregado && aba === "operadores" ? html`<${Operadores} ...${ctx} />` : null}
      ${carregado && aba === "integracao" ? html`<${Integracao} ...${ctx} setDb=${substituir} />` : null}
    </div>
  </main>
  ${confirmar ? html`<${Modal} titulo=${confirmar.titulo} onClose=${() => setConfirmar(null)}>
      <p class="m-0">${confirmar.texto}</p>
      <div class="flex flex-wrap justify-end gap-2"><button class="btn btn-ghost" onClick=${() => setConfirmar(null)}>Cancelar</button>
      <button class=${"btn " + (confirmar.perigo ? "btn-out" : "")} onClick=${() => { const a = confirmar.acao; setConfirmar(null); a(); }}>${confirmar.botao || "Confirmar"}</button></div>
    <//>` : null}
  ${textoSaida ? html`<${Modal} titulo=${"Copiar " + textoSaida.nome} onClose=${() => setTextoSaida(null)} largo=${true}>
      <p class="m-0 text-sm text-muted">Esta visualização não permite baixar arquivos. Copie o conteúdo abaixo e cole num arquivo com o nome <b class="font-mono">${textoSaida.nome}</b>.</p>
      <textarea class="inp font-mono text-xs" style=${{ minHeight: 280 }} readonly id="saida-texto" value=${textoSaida.conteudo}></textarea>
      <div class="flex justify-end"><button class="btn" onClick=${() => { const el = document.getElementById("saida-texto"); navigator.clipboard?.writeText(textoSaida.conteudo).then(() => avisar("Copiado.")).catch(() => { el.select(); avisar("Texto selecionado: use Ctrl+C.", "warn"); }); }}><${Ic} n="Copy" size=${16} /> Copiar</button></div>
    <//>` : null}
  <div class="toasts" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} class=${"card shadow-xl px-4 py-3 flex gap-2 items-start text-sm font-medium " + (t.tom === "bad" ? "text-bad" : t.tom === "warn" ? "text-warn" : "text-good")} style=${{ borderLeft: "4px solid currentColor" }}>
    <${Ic} n=${t.tom === "bad" ? "CircleX" : t.tom === "warn" ? "TriangleAlert" : "CircleCheck"} size=${18} /><span class="text-ink">${t.texto}</span></div>`)}</div>`;
}

/* ================= aba: Estoque ================= */
function Estoque({ db, mudar, setConfirmar, irPara, setPreMov, avisar }) {
  const [busca, setBusca] = useState("");
  const [cat, setCat] = useState("");
  const [st, setSt] = useState("");
  const [ordem, setOrdem] = useState("nome");
  const [editar, setEditar] = useState(null);
  const cats = useMemo(() => [...new Set(db.itens.map((i) => i.categoria).filter(Boolean))].sort(), [db.itens]);
  const lista = useMemo(() => {
    const t = norm(busca);
    let l = db.itens.filter((i) => (!t || norm(i.nome).includes(t) || norm(i.sku).includes(t) || norm(i.local).includes(t) || (i.seriais || []).some((x) => norm(x).includes(t)))
      && (!cat || i.categoria === cat) && (!st || (st === "SemValor" ? !(i.valor > 0) : statusItem(i) === st)));
    const f = { nome: (a, b) => a.nome.localeCompare(b.nome, "pt-BR"), qtd_asc: (a, b) => a.qtd - b.qtd, qtd_desc: (a, b) => b.qtd - a.qtd,
      total_desc: (a, b) => b.qtd * b.valor - a.qtd * a.valor, total_asc: (a, b) => a.qtd * a.valor - b.qtd * b.valor, unit_desc: (a, b) => b.valor - a.valor };
    return l.sort(f[ordem]);
  }, [db.itens, busca, cat, st, ordem]);
  const totalFiltro = lista.reduce((s, i) => s + i.qtd * i.valor, 0);
  const excluir = (it) => {
    const pl = naPlanilha(it);
    if (pl && Math.abs(Number(it.qtd) || 0) > 0) return avisar(`${it.nome} ainda tem ${qtdFmt(it.qtd)} ${it.unidade} no estoque. Zere o saldo (saída, descarte ou ajuste de contagem) antes de excluir.`, "warn");
    setConfirmar({ titulo: "Excluir item", perigo: true, botao: "Excluir item",
      texto: pl ? `Excluir ${it.nome} (${it.sku})? Ele sai também da aba Contagem da planilha. As linhas dele na Movimentação continuam lá, como histórico.` : `Excluir ${it.nome} (${it.sku})? O histórico de movimentações dele continua guardado.`,
      acao: () => mudar((d) => {
        if (pl) { const p = d.planilha || {}; d.planilha = { ...ALVO_PADRAO, ...p, remover: [...(p.remover || []), it.correcaoPlanilha ? it.correcaoPlanilha.de : valsItem(it)] }; }
        d.itens = d.itens.filter((x) => x.id !== it.id);
      }, `${it.nome} excluído.`) });
  };
  const contagem = (s) => db.itens.filter((i) => statusItem(i) === s).length;
  const semValor = db.itens.filter((i) => !(i.valor > 0)).length;

  return html`
  <section class="flex flex-wrap items-end justify-between gap-3">
    <div><p class="lbl m-0" style=${{ color: "rgb(var(--accent-ink))" }}>Cadastro</p><h2 class="font-display text-3xl font-bold m-0">Itens em estoque</h2></div>
    <button class="btn" onClick=${() => setEditar({})}><${Ic} n="Plus" size=${17} /> Novo item</button>
  </section>
  <section class="card p-4 flex flex-col gap-3">
    <div class="grid gap-3" style=${{ gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))" }}>
      <div class="field"><label class="lbl" for="f-busca">Procurar</label>
        <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted"><${Ic} n="Search" size=${16} /></span>
        <input id="f-busca" class="inp" style=${{ paddingLeft: 34 }} type="search" placeholder="Nome, SKU/código ou local" value=${busca} onInput=${(e) => setBusca(e.target.value)} /></div></div>
      <${Campo} id="f-cat" rotulo="Categoria"><select id="f-cat" class="inp" value=${cat} onChange=${(e) => setCat(e.target.value)}><option value="">Todas</option>${cats.map((c) => html`<option key=${c}>${c}</option>`)}</select><//>
      <${Campo} id="f-st" rotulo="Status"><select id="f-st" class="inp" value=${st} onChange=${(e) => setSt(e.target.value)}>
        <option value="">Todos</option><option value="Normal">Normal (${contagem("Normal")})</option><option value="Baixo">Estoque baixo (${contagem("Baixo")})</option><option value="Esgotado">Esgotado (${contagem("Esgotado")})</option><option value="SemValor">Sem valor unitário (${semValor})</option></select><//>
      <${Campo} id="f-ord" rotulo="Ordenar por"><select id="f-ord" class="inp" value=${ordem} onChange=${(e) => setOrdem(e.target.value)}>
        <option value="nome">Nome (A–Z)</option><option value="total_desc">Maior valor total</option><option value="total_asc">Menor valor total</option>
        <option value="qtd_desc">Maior quantidade</option><option value="qtd_asc">Menor quantidade</option><option value="unit_desc">Maior valor unitário</option></select><//>
    </div>
    <p class="m-0 text-sm text-muted">${lista.length} de ${db.itens.length} itens · valor desta seleção: <b class="num text-ink">${brl(totalFiltro)}</b>
      ${semValor ? html` · <button class="underline font-semibold text-warn" style=${{ background: "none", border: 0, padding: 0, cursor: "pointer" }} onClick=${() => setSt("SemValor")}>${semValor} item(ns) sem valor unitário</button>` : null}</p>
  </section>
  <section class="card overflow-hidden">
    ${lista.length ? html`<div class="scroll-x"><table class="grid-t">
      <thead><tr><th>Item</th><th>Categoria</th><th class="r">Saldo</th><th class="r">Mínimo</th><th class="r">Valor unit.</th><th class="r">Valor total</th><th>Status</th><th></th></tr></thead>
      <tbody>${lista.map((i) => { const s = statusItem(i); return html`<tr key=${i.id}>
        <td><div class="font-semibold">${i.nome}</div><div class="text-xs text-muted"><span class="font-mono">${i.sku}</span>${i.local ? " · " + i.local : ""}${(i.seriais || []).length ? ` · ${i.seriais.length} serial(is)` : ""}</div></td>
        <td class="text-sm">${i.categoria}</td>
        <td class="r num font-semibold">${qtdFmt(i.qtd)} <span class="text-muted font-normal">${i.unidade}</span></td>
        <td class="r num text-muted">${qtdFmt(i.minimo)}</td>
        <td class="r num">${brl(i.valor)}</td>
        <td class="r num font-semibold">${brl(i.qtd * i.valor)}</td>
        <td><span class=${"chip " + CHIP_STATUS[s]}>${s === "Baixo" ? "Estoque baixo" : s}</span></td>
        <td><div class="flex gap-1 justify-end">
          <button class="btn btn-ghost btn-sm" title="Registrar saída" aria-label=${"Saída de " + i.nome} onClick=${() => { setPreMov({ tipo: "Saída", itemId: i.id }); irPara("movimentar"); }}><${Ic} n="ArrowUpFromLine" size=${15} /></button>
          <button class="btn btn-ghost btn-sm" title="Registrar entrada" aria-label=${"Entrada de " + i.nome} onClick=${() => { setPreMov({ tipo: "Entrada", itemId: i.id }); irPara("movimentar"); }}><${Ic} n="ArrowDownToLine" size=${15} /></button>
          <button class="btn btn-ghost btn-sm" title="Editar" aria-label=${"Editar " + i.nome} onClick=${() => setEditar(i)}><${Ic} n="Pencil" size=${15} /></button>
          <button class="btn btn-ghost btn-sm" title="Excluir" aria-label=${"Excluir " + i.nome} onClick=${() => excluir(i)}><${Ic} n="Trash2" size=${15} className="text-bad" /></button>
        </div></td></tr>`; })}</tbody></table></div>`
    : html`<${Vazio} icone="Search" texto=${db.itens.length ? "Nenhum item com esses filtros." : "Nenhum item cadastrado ainda."}>
        ${db.itens.length ? html`<button class="btn btn-ghost" onClick=${() => { setBusca(""); setCat(""); setSt(""); }}>Limpar filtros</button>` : html`<button class="btn" onClick=${() => setEditar({})}><${Ic} n="Plus" size=${16} /> Cadastrar o primeiro item</button>`}<//>`}
  </section>
  ${editar ? html`<${ItemForm} item=${editar} db=${db} mudar=${mudar} fechar=${() => setEditar(null)} cats=${cats} />` : null}`;
}

function ItemForm({ item, db, mudar, fechar, cats }) {
  const novo = !item.id;
  const [f, setF] = useState({ nome: item.nome || "", sku: item.sku || "", categoria: item.categoria || "", unidade: item.unidade || "un",
    qtd: novo ? "0" : "", minimo: String(item.minimo ?? 0), valor: item.valor != null ? String(item.valor).replace(".", ",") : "", local: item.local || "", obs: "" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const v = { valor: num(f.valor), minimo: num(f.minimo), qtd: num(f.qtd) };
  const skuRepetido = f.sku.trim() && db.itens.some((i) => i.id !== item.id && norm(i.sku) === norm(f.sku));
  const erros = { nome: !f.nome.trim() && "Informe o nome.", sku: !f.sku.trim() && "Informe o SKU/código.",
    valor: !(v.valor >= 0) && "Informe um valor (ex.: 18,90).", minimo: !(v.minimo >= 0) && "Use 0 ou mais.",
    qtd: novo ? !(v.qtd >= 0) && "Use 0 ou mais." : f.qtd !== "" && !(v.qtd >= 0) && "Use 0 ou mais." };
  const ok = !Object.values(erros).some(Boolean);
  const qtdBase = novo ? v.qtd || 0 : f.qtd !== "" && v.qtd >= 0 ? v.qtd : item.qtd;
  const enviar = (e) => {
    e.preventDefault(); if (!ok) return;
    const dados = { nome: f.nome.trim().toUpperCase(), sku: f.sku.trim().toUpperCase(), categoria: f.categoria.trim() || "Geral", unidade: f.unidade, minimo: v.minimo, valor: v.valor, local: f.local.trim() };
    const feito = mudar((d) => {
      if (novo) {
        const it = { id: uid("i"), ...dados, qtd: 0, criadoEm: agora() };
        d.itens.push(it);
        if (v.qtd > 0) aplicarMov(d, { tipo: "Entrada", itemId: it.id, qtd: v.qtd, origem: "Cadastro", obs: "Saldo inicial" });
      } else {
        const it = d.itens.find((x) => x.id === item.id);
        const antes = valsItem(it), eraPlanilha = naPlanilha(it);
        Object.assign(it, dados);
        /* nome, SKU ou local mudou num item que já está na planilha: a correção vai junto no próximo envio */
        if (eraPlanilha) {
          const de = it.correcaoPlanilha ? it.correcaoPlanilha.de : antes;
          if (chaveVals(de) !== chaveVals(valsItem(it))) it.correcaoPlanilha = { de, em: agora() }; else delete it.correcaoPlanilha;
        }
        if (f.qtd !== "" && v.qtd !== it.qtd) {
          const delta = Math.round((v.qtd - it.qtd) * 1000) / 1000;
          aplicarMov(d, { tipo: "Ajuste", itemId: it.id, qtd: delta, origem: "Contagem", obs: f.obs.trim() || `Ajuste de contagem: ${qtdFmt(it.qtd)} → ${qtdFmt(v.qtd)}` });
        }
      }
    }, novo ? `${dados.nome} cadastrado.` : `${dados.nome} atualizado.`);
    if (feito) fechar();
  };
  return html`<${Modal} titulo=${novo ? "Novo item" : "Editar item"} onClose=${fechar}>
    <form class="flex flex-col gap-4" onSubmit=${enviar} noValidate>
      <${Campo} id="it-nome" rotulo="Nome do item" erro=${f.nome && erros.nome}><input id="it-nome" class="inp" value=${f.nome} onInput=${set("nome")} placeholder="CABO DE REDE CAT6" autoFocus /><//>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <${Campo} id="it-sku" rotulo="SKU / código" erro=${f.sku && erros.sku} dica=${skuRepetido ? "Outro item já usa esse código (pode ser o mesmo produto em outra caixa)." : null}><input id="it-sku" class="inp font-mono" aria-invalid=${!!(f.sku && erros.sku)} value=${f.sku} onInput=${set("sku")} placeholder="CB-06" /><//>
        <${Campo} id="it-cat" rotulo="Categoria"><input id="it-cat" class="inp" list="lista-cats" value=${f.categoria} onInput=${set("categoria")} placeholder="Rede e cabos" /><datalist id="lista-cats">${cats.map((c) => html`<option key=${c} value=${c} />`)}</datalist><//>
        <${Campo} id="it-un" rotulo="Unidade de medida"><select id="it-un" class="inp" value=${f.unidade} onChange=${set("unidade")}>${UNIDADES.map((u) => html`<option key=${u}>${u}</option>`)}</select><//>
        <${Campo} id="it-local" rotulo="Local (estante · PT · caixa)"><input id="it-local" class="inp" value=${f.local} onInput=${set("local")} placeholder="Estante 3 · PT2 · Caixa 12" /><//>
        <${Campo} id="it-qtd" rotulo=${novo ? "Quantidade inicial" : "Saldo contado (opcional)"} erro=${erros.qtd} dica=${novo ? "Vira uma entrada \"Saldo inicial\" no histórico." : `Hoje: ${qtdFmt(item.qtd)} ${item.unidade}. Se mudar, fica registrado como ajuste.`}>
          <input id="it-qtd" class="inp num" inputMode="decimal" value=${f.qtd} onInput=${set("qtd")} placeholder=${novo ? "0" : qtdFmt(item.qtd)} /><//>
        <${Campo} id="it-min" rotulo="Estoque mínimo" erro=${erros.minimo} dica="Abaixo ou igual a isso, o item entra em alerta."><input id="it-min" class="inp num" inputMode="decimal" value=${f.minimo} onInput=${set("minimo")} /><//>
        <${Campo} id="it-valor" rotulo="Valor unitário (R$)" erro=${f.valor && erros.valor}><input id="it-valor" class="inp num" inputMode="decimal" value=${f.valor} onInput=${set("valor")} placeholder="18,90" /><//>
        <div class="field"><span class="lbl">Valor total em estoque</span><div class="inp num font-semibold" style=${{ background: "rgb(var(--surface2))" }} aria-live="polite">${brl((v.valor >= 0 ? v.valor : 0) * (qtdBase || 0))}</div></div>
      </div>
      ${!novo && f.qtd !== "" ? html`<${Campo} id="it-obs" rotulo="Motivo do ajuste"><input id="it-obs" class="inp" value=${f.obs} onInput=${set("obs")} placeholder="Contagem de inventário" /><//>` : null}
      <div class="flex flex-wrap justify-end gap-2"><button type="button" class="btn btn-ghost" onClick=${fechar}>Cancelar</button><button class="btn" disabled=${!ok}><${Ic} n="CircleCheck" size=${17} /> ${novo ? "Cadastrar" : "Salvar"}</button></div>
    </form><//>`;
}

/* ================= aba: Movimentar ================= */
function Movimentar({ db, mudar, destinos, preMov, setPreMov, irPara }) {
  const [tipo, setTipo] = useState(preMov?.tipo || "Saída");
  const vazio = { itemId: preMov?.itemId || "", qtd: "1", destino: "", operadorId: "", os: "", nf: "", lote: "", obs: "", novoValor: "", modoValor: "medio" };
  const [f, setF] = useState(vazio);
  useEffect(() => { if (preMov) setPreMov(null); }, []);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const it = db.itens.find((i) => i.id === f.itemId);
  const q = num(f.qtd);
  const ativos = db.operadores.filter((o) => o.status === "Ativo");
  const nv = num(f.novoValor);
  const erros = {
    item: !it && "Escolha o item.",
    qtd: !(q > 0) ? "Informe uma quantidade maior que zero." : tipo === "Saída" && it && q > it.qtd ? `Saldo insuficiente: há ${qtdFmt(it.qtd)} ${it.unidade}.` : null,
    destino: tipo === "Saída" && !f.destino.trim() && "O destino é obrigatório.",
    operador: tipo === "Saída" && !f.operadorId && "Escolha quem retirou.",
    valor: tipo === "Entrada" && f.novoValor.trim() && !(nv >= 0) && "Valor inválido.",
  };
  const nLotes = separarLotes(f.lote).length;
  erros.lote = nLotes > 1 && q > 0 && nLotes !== q ? `São ${nLotes} seriais para ${qtdFmt(q)} unidade(s): a quantidade precisa bater.` : null;
  const ok = !Object.values(erros).some(Boolean);
  const [tocado, setTocado] = useState(false);
  const seriaisItem = (it && it.seriais) || [];
  const precoNovo = it && tipo === "Entrada" && nv >= 0 && f.novoValor.trim() ? (f.modoValor === "substituir" ? nv : (it.qtd > 0 ? (it.qtd * it.valor + q * nv) / (it.qtd + (q || 0)) : nv)) : null;
  const ultimos = db.movs.slice(-8).reverse();
  const enviar = (e) => {
    e.preventDefault(); setTocado(true); if (!ok) return;
    const op = tipo === "Saída" ? db.operadores.find((o) => o.id === f.operadorId) : null;
    const feito = mudar((d) => aplicarMov(d, { tipo, itemId: f.itemId, qtd: q, destino: f.destino, operador: op, os: f.os.trim(), nf: f.nf.trim(), lote: separarLotes(f.lote).join(", "), obs: f.obs.trim(),
      novoValor: tipo === "Entrada" && f.novoValor.trim() ? nv : null, modoValor: f.modoValor }),
      (m) => `${tipo} registrada: ${qtdFmt(m.qtd)} ${m.unidade} de ${m.nome}. Saldo: ${qtdFmt(m.saldoApos)}.`);
    if (feito) { setF({ ...vazio, itemId: "", destino: tipo === "Saída" ? f.destino : "", operadorId: tipo === "Saída" ? f.operadorId : "" }); setTocado(false); }
  };
  const porCat = useMemo(() => { const g = {}; db.itens.forEach((i) => (g[i.categoria] = g[i.categoria] || []).push(i)); return Object.entries(g).sort(); }, [db.itens]);
  const sai = tipo === "Saída";
  return html`
  <section><p class="lbl m-0" style=${{ color: "rgb(var(--accent-ink))" }}>Operação</p><h2 class="font-display text-3xl font-bold m-0">Registrar movimentação</h2></section>
  <div class="grid gap-5 lg:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)] items-start">
    <form class="card overflow-hidden" onSubmit=${enviar} noValidate style=${{ borderTop: `4px solid rgb(var(${sai ? "--btn-out" : "--btn-in"}))` }}>
      <div class="p-4 border-b border-line"><div class="grid grid-cols-2 gap-1.5 p-1.5 rounded-xl bg-surface2 border border-line" role="group" aria-label="Tipo">
        ${["Saída", "Entrada"].map((t) => html`<button type="button" key=${t} onClick=${() => { setTipo(t); setTocado(false); }} aria-pressed=${tipo === t}
          class=${"flex items-center justify-center gap-2 py-2.5 rounded-lg font-display font-bold uppercase tracking-wider text-[1.05rem] " + (tipo === t ? (t === "Saída" ? "btn-out" : "btn-in") : "bg-transparent text-muted hover:text-ink")}
          style=${{ border: 0 }}><${Ic} n=${t === "Saída" ? "ArrowUpFromLine" : "ArrowDownToLine"} size=${18} /> ${t}</button>`)}</div></div>
      <div class="p-5 flex flex-col gap-4">
        <${Campo} id="mv-item" rotulo="Item" erro=${tocado && erros.item}>
          <select id="mv-item" class="inp" value=${f.itemId} onChange=${set("itemId")} aria-invalid=${!!(tocado && erros.item)}>
            <option value="">Escolha o item…</option>
            ${porCat.map(([c, its]) => html`<optgroup key=${c} label=${c}>${its.map((i) => html`<option key=${i.id} value=${i.id}>${i.sku} · ${i.nome} — saldo ${qtdFmt(i.qtd)} ${i.unidade}</option>`)}</optgroup>`)}
          </select><//>
        ${it ? html`<div class="flex flex-wrap gap-x-5 gap-y-1 text-sm p-3 rounded-lg bg-surface2 border border-line">
          <span>Saldo: <b class="num">${qtdFmt(it.qtd)} ${it.unidade}</b></span><span>Valor unit.: <b class="num">${brl(it.valor)}</b></span>
          ${it.local ? html`<span class="text-muted">${it.local}</span>` : null}<span class=${"chip " + CHIP_STATUS[statusItem(it)]}>${statusItem(it) === "Baixo" ? "Estoque baixo" : statusItem(it)}</span></div>` : null}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <${Campo} id="mv-qtd" rotulo=${"Quantidade" + (it ? ` (${it.unidade})` : "")} erro=${(tocado || (sai && it && q > it.qtd)) && erros.qtd}>
            <input id="mv-qtd" class="inp num" inputMode="decimal" value=${f.qtd} onInput=${set("qtd")} aria-invalid=${!!((tocado || (sai && it && q > it.qtd)) && erros.qtd)} /><//>
          <div class="field"><span class="lbl">Valor movimentado</span><div class="inp num font-semibold" style=${{ background: "rgb(var(--surface2))" }}>${brl(it && q > 0 ? q * (precoNovo ?? it.valor) : 0)}</div></div>
        </div>
        <${Campo} id="mv-lote" rotulo="Serial / lote (opcional)" erro=${erros.lote} dica=${sai && seriaisItem.length ? `${seriaisItem.length} serial(is) em estoque. Vários: separe por vírgula.` : "Vários: separe por vírgula; vira uma linha por serial na planilha."}>
          <input id="mv-lote" class="inp font-mono" list="lista-seriais" value=${f.lote} onInput=${set("lote")} placeholder="Y522HX5T901285D" aria-invalid=${!!erros.lote} />
          <datalist id="lista-seriais">${(sai ? seriaisItem : []).map((x) => html`<option key=${x} value=${x} />`)}</datalist><//>
        ${sai ? html`
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <${Campo} id="mv-dest" rotulo="Destino" erro=${tocado && erros.destino} dica="Setor, obra, cliente ou centro de custo.">
              <input id="mv-dest" class="inp" list="lista-destinos" value=${f.destino} onInput=${set("destino")} placeholder="Montagem" aria-invalid=${!!(tocado && erros.destino)} />
              <datalist id="lista-destinos">${destinos.map((d) => html`<option key=${d} value=${d} />`)}</datalist><//>
            <${Campo} id="mv-op" rotulo="Operador responsável" erro=${tocado && erros.operador} dica=${ativos.length ? "Só operadores ativos aparecem aqui." : null}>
              <select id="mv-op" class="inp" value=${f.operadorId} onChange=${set("operadorId")} aria-invalid=${!!(tocado && erros.operador)}>
                <option value="">Quem retirou?</option>${ativos.map((o) => html`<option key=${o.id} value=${o.id}>${o.nome} · ${o.matricula} · ${o.setor}</option>`)}</select><//>
          </div>
          ${!ativos.length ? html`<p class="m-0 text-sm text-warn">Nenhum operador ativo. <button type="button" class="underline font-semibold" onClick=${() => irPara("operadores")}>Cadastre um operador</button> antes de registrar saídas.</p>` : null}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <${Campo} id="mv-os" rotulo="Ordem de serviço"><input id="mv-os" class="inp font-mono" value=${f.os} onInput=${set("os")} placeholder="0000/00" /><//>
            <${Campo} id="mv-obs" rotulo="Observação"><input id="mv-obs" class="inp" value=${f.obs} onInput=${set("obs")} placeholder="Motivo, máquina…" /><//>
          </div>` : html`
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <${Campo} id="mv-nf" rotulo="Nota fiscal / documento"><input id="mv-nf" class="inp font-mono" value=${f.nf} onInput=${set("nf")} placeholder="123" /><//>
            <${Campo} id="mv-obs2" rotulo="Fornecedor / observação"><input id="mv-obs2" class="inp" value=${f.obs} onInput=${set("obs")} placeholder="Fornecedor X" /><//>
            <${Campo} id="mv-val" rotulo="Novo valor unitário (opcional)" erro=${erros.valor} dica=${it ? `Atual: ${brl(it.valor)}` : null}><input id="mv-val" class="inp num" inputMode="decimal" value=${f.novoValor} onInput=${set("novoValor")} placeholder="Deixe vazio para manter" /><//>
            <${Campo} id="mv-modo" rotulo="Como atualizar o valor"><select id="mv-modo" class="inp" value=${f.modoValor} onChange=${set("modoValor")} disabled=${!f.novoValor.trim()}>
              <option value="medio">Custo médio ponderado</option><option value="substituir">Substituir pelo novo valor</option></select><//>
          </div>
          ${precoNovo != null ? html`<p class="m-0 text-sm">Valor unitário passa de <b class="num">${brl(it.valor)}</b> para <b class="num">${brl(precoNovo)}</b>.</p>` : null}`}
      </div>
      <div class="px-5 py-3 border-t border-line bg-surface2 flex justify-end">
        <button class=${"btn w-full sm:w-auto " + (sai ? "btn-out" : "btn-in")} disabled=${tocado && !ok}><${Ic} n=${sai ? "ArrowUpFromLine" : "ArrowDownToLine"} size=${17} /> Registrar ${sai ? "saída" : "entrada"}</button>
      </div>
    </form>
    <section class="card overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-line"><h3 class="font-display text-lg font-bold uppercase tracking-wide m-0 flex items-center gap-2"><${Ic} n="Clock" size=${17} /> Últimos registros</h3>
        <button class="btn btn-ghost btn-sm" onClick=${() => irPara("historico")}>Ver histórico</button></div>
      ${ultimos.length ? html`<ul class="m-0 p-0 list-none">${ultimos.map((m) => html`<li key=${m.id} class="px-4 py-3 border-b border-line last:border-0 grid grid-cols-[auto_minmax(0,1fr)] gap-x-3">
        <span class=${"num font-semibold text-sm px-2 py-0.5 rounded h-fit " + (m.tipo === "Saída" ? "bg-bad-soft text-bad" : m.tipo === "Entrada" ? "bg-good-soft text-good" : "bg-info-soft text-info")}>${m.tipo === "Saída" ? "−" : m.qtd < 0 ? "−" : "+"}${qtdFmt(Math.abs(m.qtd))}</span>
        <span class="min-w-0"><span class="font-semibold block truncate">${m.nome}</span>
        <span class="text-xs text-muted block">${dataHora(m.dataHora)}${m.destino ? " · " + m.destino : ""}${m.operadorNome ? " · " + m.operadorNome : ""}${m.origem !== "Manual" ? " · " + m.origem : ""}</span></span></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma movimentação ainda." />`}
    </section>
  </div>`;
}

/* ================= aba: Histórico ================= */
function Historico({ db, baixar, mudar, setConfirmar }) {
  const [limiteLinhas, setLimiteLinhas] = useState(200);
  const ateEnvio = enviadoAte(db);
  const estornar = (m) => setConfirmar({ titulo: "Estornar lançamento", botao: "Estornar",
    texto: `Estornar o lançamento nº ${m.n} (${m.tipo} de ${qtdFmt(m.qtd)} ${m.unidade} de ${m.nome})? É registrado o movimento contrário${m.linhasPlanilha && m.linhasPlanilha.length ? `, que vira uma linha nova na planilha (a linha ${intervalo(m.linhasPlanilha)} continua lá, como histórico)` : ""}. O saldo volta ao que era.`,
    acao: () => mudar((d) => {
      const o = d.movs.find((x) => x.id === m.id);
      if (!o || o.estornadoPor) throw new Error("Esse lançamento já foi estornado.");
      const op = d.operadores.find((x) => x.id === o.operadorId) || null;
      const novo = aplicarMov(d, { tipo: o.tipo === "Saída" ? "Entrada" : "Saída", itemId: o.itemId, qtd: o.qtd, destino: o.tipo === "Saída" ? "" : "Ajuste de inventário", operador: op,
        lote: o.lote || "", nf: o.nf || "", os: o.os || "", estorno: true, origem: "Estorno",
        obs: `Estorno do lançamento nº ${o.n}${o.linhasPlanilha && o.linhasPlanilha.length ? ` (linha ${intervalo(o.linhasPlanilha)} da planilha)` : ""}` });
      novo.estornoDe = o.id; o.estornadoPor = novo.id;
      return novo;
    }, (n) => `Estorno registrado (nº ${n.n}).`) });
  const [f, setF] = useState({ busca: "", tipo: "", destino: "", operador: "", de: "", ate: "" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const destinos = useMemo(() => [...new Set(db.movs.map((m) => m.destino).filter(Boolean))].sort(), [db.movs]);
  const ops = useMemo(() => [...new Set(db.movs.map((m) => m.operadorNome).filter(Boolean))].sort(), [db.movs]);
  const lista = useMemo(() => {
    const t = norm(f.busca);
    return db.movs.filter((m) => (!t || [m.nome, m.sku, m.obs, m.nf, m.os, m.origem].some((x) => norm(x).includes(t)))
      && (!f.tipo || m.tipo === f.tipo) && (!f.destino || m.destino === f.destino) && (!f.operador || m.operadorNome === f.operador)
      && (!f.de || isoLocal(new Date(m.dataHora)).slice(0, 10) >= f.de) && (!f.ate || isoLocal(new Date(m.dataHora)).slice(0, 10) <= f.ate)).slice().reverse();
  }, [db.movs, f]);
  const tot = lista.reduce((a, m) => { if (m.tipo === "Entrada") a.e += m.valorTotal; else if (m.tipo === "Saída") a.s += m.valorTotal; return a; }, { e: 0, s: 0 });
  const exportar = () => baixar(`Movimentacao ${new Date().toISOString().slice(0, 10)}.csv`, paraCsv([
    ["Nº", "Data", "Hora", "Movimentação", "SKU", "Descrição", "Unid.", "Quantidade", "Valor unit. (R$)", "Valor total (R$)", "Destino / Área", "Operador", "Matrícula", "OS", "NF", "Origem", "Observação", "Saldo após"],
    ...lista.slice().reverse().map((m) => { const d = new Date(m.dataHora); return [m.n, d.toLocaleDateString("pt-BR"), d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), m.tipo, m.sku, m.nome, m.unidade,
      String(m.tipo === "Saída" ? -m.qtd : m.qtd).replace(".", ","), String(m.valorUnit.toFixed(2)).replace(".", ","), String(m.valorTotal.toFixed(2)).replace(".", ","),
      m.destino, m.operadorNome, m.operadorMatricula, m.os, m.nf, m.origem, m.obs, String(m.saldoApos).replace(".", ",")]; })]));
  return html`
  <section class="flex flex-wrap items-end justify-between gap-3">

    <button class="btn btn-ghost" onClick=${exportar} disabled=${!lista.length}><${Ic} n="FileSpreadsheet" size=${16} /> Exportar CSV (${lista.length})</button>
  </section>
  <section class="card p-4 grid gap-3" style=${{ gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))" }}>
    <${Campo} id="h-busca" rotulo="Procurar"><input id="h-busca" class="inp" type="search" value=${f.busca} onInput=${set("busca")} placeholder="Item, SKU, NF, OS, R-0001" /><//>
    <${Campo} id="h-tipo" rotulo="Tipo"><select id="h-tipo" class="inp" value=${f.tipo} onChange=${set("tipo")}><option value="">Todos</option><option>Entrada</option><option>Saída</option><option>Ajuste</option></select><//>
    <${Campo} id="h-dest" rotulo="Destino"><select id="h-dest" class="inp" value=${f.destino} onChange=${set("destino")}><option value="">Todos</option>${destinos.map((d) => html`<option key=${d}>${d}</option>`)}</select><//>
    <${Campo} id="h-op" rotulo="Operador"><select id="h-op" class="inp" value=${f.operador} onChange=${set("operador")}><option value="">Todos</option>${ops.map((d) => html`<option key=${d}>${d}</option>`)}</select><//>
    <${Campo} id="h-de" rotulo="De"><input id="h-de" class="inp" type="date" value=${f.de} onInput=${set("de")} /><//>
    <${Campo} id="h-ate" rotulo="Até"><input id="h-ate" class="inp" type="date" value=${f.ate} onInput=${set("ate")} /><//>
  </section>
  <section class="flex flex-wrap gap-2 text-sm">
    <span class="chip chip-plain">${lista.length} registro(s)</span><span class="chip chip-ok">Entradas ${brl(tot.e)}</span><span class="chip chip-bad">Saídas ${brl(tot.s)}</span>
  </section>
  <section class="card overflow-hidden">
    ${lista.length ? html`<div class="scroll-x" style=${{ maxHeight: "70vh" }}><table class="grid-t">
      <thead><tr><th>#</th><th>Data/hora</th><th>Tipo</th><th>Item</th><th class="r">Qtd</th><th class="r">Valor</th><th>Destino</th><th>Operador</th><th>Doc.</th><th>Origem</th><th class="r">Saldo após</th><th>Planilha</th><th></th></tr></thead>
      <tbody>${lista.slice(0, limiteLinhas).map((m) => html`<tr key=${m.id}>
        <td class="num text-muted">${m.n}</td><td class="num text-sm whitespace-nowrap">${dataHora(m.dataHora)}</td>
        <td><span class=${"chip " + (m.tipo === "Saída" ? "chip-bad" : m.tipo === "Entrada" ? "chip-ok" : "chip-info")}>${m.tipo}</span></td>
        <td><div class="font-semibold">${m.nome}</div><div class="text-xs text-muted font-mono">${m.sku}${m.obs ? html`<span class="font-sans"> · ${m.obs}</span>` : null}</div></td>
        <td class=${"r num font-semibold " + (m.tipo === "Saída" || m.qtd < 0 ? "text-bad" : "text-good")}>${m.tipo === "Saída" || m.qtd < 0 ? "−" : "+"}${qtdFmt(Math.abs(m.qtd))} <span class="text-muted font-normal">${m.unidade}</span></td>
        <td class="r num">${brl(m.valorTotal)}<div class="text-xs text-muted">${brl(m.valorUnit)}/${m.unidade}</div></td>
        <td>${m.destino || html`<span class="text-muted">—</span>`}</td>
        <td>${m.operadorNome ? html`${m.operadorNome}<div class="text-xs text-muted font-mono">${m.operadorMatricula}</div>` : html`<span class="text-muted">—</span>`}</td>
        <td class="text-sm font-mono">${[m.nf && "NF " + m.nf, m.os && "OS " + m.os].filter(Boolean).join(" · ") || html`<span class="text-muted font-sans">—</span>`}</td>
        <td class="text-sm">${m.origem}${m.estornadoPor ? html`<div><span class="chip chip-warn">Estornado</span></div>` : null}</td><td class="r num">${qtdFmt(m.saldoApos)}</td>
        <td class="text-sm whitespace-nowrap">${m.linhasPlanilha && m.linhasPlanilha.length ? `linha ${intervalo(m.linhasPlanilha)}` : (m.n || 0) > ateEnvio && !m.naPlanilha ? html`<span class="chip chip-warn">Aguardando</span>` : html`<span class="text-muted">—</span>`}</td>
        <td>${m.tipo !== "Ajuste" && !m.estornadoPor && !m.estornoDe && !/^Descarte/.test(String(m.origem || "")) ? html`<button class="btn btn-ghost btn-sm" title="Registrar o movimento contrário" aria-label=${"Estornar lançamento " + m.n} onClick=${() => estornar(m)}><${Ic} n="Undo2" size=${14} /> Estornar</button>` : null}</td></tr>`)}</tbody></table>
      ${lista.length > limiteLinhas ? html`<div class="p-3 text-center border-t border-line"><button class="btn btn-ghost" onClick=${() => setLimiteLinhas(limiteLinhas + 300)}>Mostrar mais (${lista.length - limiteLinhas} restantes)</button></div>` : null}</div>`
    : html`<${Vazio} icone="History" texto="Nenhuma movimentação com esses filtros." />`}
  </section>`;
}

/* ================= aba: Descartes (aba DESCARTES da planilha) ================= */
const DESTINOS_DESCARTE = ["Lixo eletrônico", "Descarte", "Devolução ao fornecedor", "Doação", "Reciclagem"];
function Descartes({ db, mudar, setConfirmar }) {
  const hoje = isoLocal(new Date()).slice(0, 10);
  const inicial = { modo: "estoque", itemId: "", material: "", qtd: "1", seriais: "", motivo: "", destino: "Lixo eletrônico", responsavelId: "", autorizado: "", documento: "", obs: "", data: hoje };
  const [f, setF] = useState(inicial);
  const [tocado, setTocado] = useState(false);
  const [busca, setBusca] = useState("");
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const ativos = db.operadores.filter((o) => o.status === "Ativo");
  const estoque = f.modo === "estoque";
  const it = estoque ? db.itens.find((i) => i.id === f.itemId) : null;
  const q = num(f.qtd), lotes = separarLotes(f.seriais);
  const erros = {
    item: estoque && !it && "Escolha o item.",
    material: !estoque && !f.material.trim() && "Descreva o material.",
    qtd: !(q > 0) ? "Informe a quantidade." : estoque && it && q > it.qtd ? `Saldo insuficiente: há ${qtdFmt(it.qtd)} ${it.unidade}.` : lotes.length > 1 && lotes.length !== q ? `São ${lotes.length} seriais para ${qtdFmt(q)} unidade(s).` : null,
    motivo: !f.motivo.trim() && "Informe o motivo.",
    responsavel: estoque && !f.responsavelId && "Escolha quem tirou do estoque.",
  };
  const ok = !Object.values(erros).some(Boolean);
  const porItem = useMemo(() => { const g = {}; db.itens.filter((i) => i.qtd > 0).forEach((i) => (g[i.categoria] = g[i.categoria] || []).push(i)); return Object.entries(g).sort(); }, [db.itens]);
  const salvar = (e) => {
    e.preventDefault(); setTocado(true); if (!ok) return;
    const op = db.operadores.find((o) => o.id === f.responsavelId) || null;
    const feito = mudar((d) => {
      const num = "D-" + String(Math.max(0, ...(d.descartes || []).map((x) => Number(String(x.num).replace(/\D/g, "")) || 0)) + 1).padStart(4, "0");
      let movId = null;
      if (estoque) {
        const m = aplicarMov(d, { tipo: "Saída", itemId: it.id, qtd: q, destino: "Descarte", operador: op, lote: lotes.join(", "), origem: "Descarte " + num, obs: `Descarte ${num}: ${f.motivo.trim()}` });
        movId = m.id;
      }
      d.descartes = d.descartes || [];
      d.descartes.push({ id: uid("d"), num, data: f.data || hoje, sku: it ? it.sku : "-", material: it ? it.nome : f.material.trim().toUpperCase(), serial: lotes.join(", "), qtd: q,
        origem: it ? it.local : "", motivo: f.motivo.trim(), destino: f.destino, responsavel: op ? op.nome : "", autorizado: f.autorizado.trim(), documento: f.documento.trim(), obs: f.obs.trim(), movId, criadoEm: agora() });
      return num;
    }, (num) => `Descarte ${num} registrado${estoque ? " e baixado do estoque" : ""}.`);
    if (feito) { setF({ ...inicial, modo: f.modo, destino: f.destino, responsavelId: f.responsavelId, autorizado: f.autorizado }); setTocado(false); }
  };
  const lista = useMemo(() => { const t = norm(busca); return (db.descartes || []).filter((x) => !t || [x.num, x.material, x.serial, x.motivo, x.sku, x.responsavel].some((y) => norm(y).includes(t))).slice().sort(ORDEM.descartes).reverse(); }, [db.descartes, busca]);
  const baixaTxt = (x) => x.baixa || (x.movId ? "Sim (vai junto no envio)" : "Não (fora do estoque)");
  return html`
  <section><p class="lbl m-0" style=${{ color: "rgb(var(--accent-ink))" }}>Operação</p><h2 class="font-display text-3xl font-bold m-0">Descartes</h2>
    <p class="m-0 mt-1 text-sm text-muted max-w-3xl">Material com defeito que sai de vez. Do estoque: dá baixa no item (uma saída com destino Descarte). Fora do estoque: só registra (sucata da manutenção, por exemplo). Tudo vai para a aba DESCARTES da planilha.</p></section>
  <div class="grid gap-5 lg:grid-cols-[minmax(0,1.1fr)_minmax(0,1.4fr)] items-start">
    <form class="card overflow-hidden" onSubmit=${salvar} noValidate>
      <div class="p-4 border-b border-line"><div class="grid grid-cols-2 gap-1.5 p-1.5 rounded-xl bg-surface2 border border-line" role="group" aria-label="Origem do material">
        ${[["estoque", "Do estoque"], ["fora", "Fora do estoque"]].map(([k, t]) => html`<button type="button" key=${k} aria-pressed=${f.modo === k} onClick=${() => { setF({ ...f, modo: k }); setTocado(false); }}
          class=${"py-2.5 rounded-lg font-display font-bold uppercase tracking-wider " + (f.modo === k ? "btn-out" : "bg-transparent text-muted hover:text-ink")} style=${{ border: 0 }}>${t}</button>`)}</div></div>
      <div class="p-5 flex flex-col gap-4">
        ${estoque ? html`<${Campo} id="ds-item" rotulo="Item" erro=${tocado && erros.item}>
          <select id="ds-item" class="inp" value=${f.itemId} onChange=${set("itemId")}><option value="">Escolha o item…</option>
            ${porItem.map(([c, its]) => html`<optgroup key=${c} label=${c}>${its.map((i) => html`<option key=${i.id} value=${i.id}>${i.sku} · ${i.nome} — saldo ${qtdFmt(i.qtd)}${i.local ? " · " + i.local : ""}</option>`)}</optgroup>`)}</select><//>`
        : html`<${Campo} id="ds-mat" rotulo="Material" erro=${tocado && erros.material}><input id="ds-mat" class="inp" value=${f.material} onInput=${set("material")} placeholder="Fontes queimadas" /><//>`}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <${Campo} id="ds-qtd" rotulo="Quantidade" erro=${(tocado || (it && q > it.qtd)) && erros.qtd}><input id="ds-qtd" class="inp num" inputMode="decimal" value=${f.qtd} onInput=${set("qtd")} /><//>
          <${Campo} id="ds-data" rotulo="Data"><input id="ds-data" class="inp" type="date" value=${f.data} onInput=${set("data")} /><//>
        </div>
        <${Campo} id="ds-ser" rotulo="Serial / lote (opcional)" dica="Vários: separe por vírgula.">
          <input id="ds-ser" class="inp font-mono" list="ds-lista-ser" value=${f.seriais} onInput=${set("seriais")} />
          <datalist id="ds-lista-ser">${(it ? it.seriais || [] : []).map((x) => html`<option key=${x} value=${x} />`)}</datalist><//>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <${Campo} id="ds-mot" rotulo="Motivo" erro=${tocado && erros.motivo}><input id="ds-mot" class="inp" value=${f.motivo} onInput=${set("motivo")} placeholder="Tela quebrada" /><//>
          <${Campo} id="ds-dest" rotulo="Destino"><select id="ds-dest" class="inp" value=${f.destino} onChange=${set("destino")}>${DESTINOS_DESCARTE.map((x) => html`<option key=${x}>${x}</option>`)}</select><//>
          <${Campo} id="ds-resp" rotulo=${estoque ? "Responsável" : "Responsável (opcional)"} erro=${tocado && erros.responsavel}><select id="ds-resp" class="inp" value=${f.responsavelId} onChange=${set("responsavelId")}><option value="">Quem?</option>${ativos.map((o) => html`<option key=${o.id} value=${o.id}>${o.nome}</option>`)}</select><//>
          <${Campo} id="ds-aut" rotulo="Autorizado por"><input id="ds-aut" class="inp" value=${f.autorizado} onInput=${set("autorizado")} placeholder="Nome" /><//>
          <${Campo} id="ds-doc" rotulo="Documento / laudo"><input id="ds-doc" class="inp" value=${f.documento} onInput=${set("documento")} /><//>
          <${Campo} id="ds-obs" rotulo="Observação"><input id="ds-obs" class="inp" value=${f.obs} onInput=${set("obs")} /><//>
        </div>
      </div>
      <div class="px-5 py-3 border-t border-line bg-surface2 flex justify-end"><button class="btn btn-out w-full sm:w-auto" disabled=${tocado && !ok}><${Ic} n="Recycle" size=${17} /> Registrar descarte</button></div>
    </form>
    <section class="card overflow-hidden">
      <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-3 border-b border-line"><h3 class="font-display text-lg font-bold uppercase tracking-wide m-0">${(db.descartes || []).length} descarte(s)</h3>
        <input class="inp" style=${{ maxWidth: "220px" }} type="search" aria-label="Procurar descarte" placeholder="Procurar" value=${busca} onInput=${(e) => setBusca(e.target.value)} /></div>
      ${lista.length ? html`<div class="scroll-x" style=${{ maxHeight: "70vh" }}><table class="grid-t text-sm"><thead><tr><th>Nº</th><th>Data</th><th>Material</th><th class="r">Qtd</th><th>Motivo / destino</th><th>Responsável</th><th>Baixa no estoque</th></tr></thead>
        <tbody>${lista.map((x) => html`<tr key=${x.id}><td class="font-mono whitespace-nowrap">${x.num}${x.naPlanilha ? null : html`<div><span class="chip chip-warn">Aguardando</span></div>`}</td>
          <td class="whitespace-nowrap">${x.data ? dataBR(x.data + "T12:00") : "—"}</td>
          <td><div class="font-semibold">${x.material}</div><div class="text-xs text-muted font-mono">${[x.sku && x.sku !== "-" ? x.sku : "", x.serial].filter(Boolean).join(" · ")}</div></td>
          <td class="r num">${qtdFmt(x.qtd)}</td><td>${x.motivo || "—"}<div class="text-xs text-muted">${x.destino || ""}</div></td>
          <td>${x.responsavel || "—"}${x.autorizado ? html`<div class="text-xs text-muted">Autorizado: ${x.autorizado}</div>` : null}</td><td class="text-xs">${baixaTxt(x)}</td></tr>`)}</tbody></table></div>`
      : html`<${Vazio} icone="Recycle" texto="Nenhum descarte registrado." />`}
    </section>
  </div>`;
}

/* ================= aba: Requisições ================= */
function Requisicoes({ db, mudar, avisar, irPara, setConfirmar }) {
  const [verTodas, setVerTodas] = useState(false);
  const [recusa, setRecusa] = useState({});
  const pend = db.requisicoes.filter((r) => r.status === "Pendente").slice().reverse();
  const feitas = db.requisicoes.filter((r) => r.status !== "Pendente").slice().reverse();
  const simular = () => mudar((d) => {
    const ativos = d.operadores.filter((o) => o.status === "Ativo"); const comSaldo = d.itens.filter((i) => i.qtd > 0);
    if (!ativos.length || !d.itens.length) throw new Error("Cadastre ao menos um item e um operador ativo para simular.");
    const sorte = Math.random(); const op = ativos[Math.floor(Math.random() * ativos.length)];
    const it = (comSaldo.length ? comSaldo : d.itens)[Math.floor(Math.random() * (comSaldo.length || d.itens.length))];
    const prev = new Date(Date.now() + (2 + Math.floor(Math.random() * 46)) * 36e5); prev.setMinutes(0, 0, 0);
    const destinosEx = ["Montagem", "Manutenção", "Obra Centro", "OPERADOR", "Expedição"];
    return novaRequisicao(d, { matricula: sorte < 0.15 ? "OP-099" : op.matricula, item: Math.random() < 0.5 ? it.sku : it.nome,
      qtd: sorte > 0.85 ? Math.ceil(it.qtd + 2) : Math.max(1, Math.min(it.qtd || 1, 1 + Math.floor(Math.random() * 3))),
      destino: destinosEx[Math.floor(Math.random() * destinosEx.length)], previsto: isoLocal(prev), obs: "Recebida pela simulação", fonte: "Simulação" });
  }, (r) => `Requisição ${r.num} recebida (simulação).`);
  const aprovar = (r) => {
    const { op, it, ok } = checarRequisicao(db, r);
    if (!ok) return avisar("Essa requisição ainda não passa em todas as conferências.", "bad");
    setConfirmar({ titulo: `Aprovar ${r.num}`, botao: "Aprovar e dar baixa",
      texto: `Dar baixa de ${qtdFmt(r.qtd)} ${it.unidade} de ${it.nome} (${brl(r.qtd * it.valor)}) para ${r.destino}, retirado por ${op.nome}?`,
      acao: () => mudar((d) => {
        const rr = d.requisicoes.find((x) => x.id === r.id); const c = checarRequisicao(d, rr);
        if (!c.ok) throw new Error("O estoque ou o cadastro mudou: confira de novo.");
        const m = aplicarMov(d, { tipo: "Saída", itemId: c.it.id, qtd: rr.qtd, destino: rr.destino, operador: c.op, origem: "Requisição " + rr.num,
          obs: [rr.obs, rr.previsto && "retirada prevista " + (isNaN(new Date(rr.previsto)) ? rr.previsto : dataHora(rr.previsto))].filter(Boolean).join(" · ") });
        Object.assign(rr, { status: "Aprovada", movId: m.id, itemId: c.it.id, decididoEm: agora() });
        return m;
      }, (m) => `${r.num} aprovada: saída de ${qtdFmt(m.qtd)} ${m.unidade} de ${m.nome}. Saldo: ${qtdFmt(m.saldoApos)}.`) });
  };
  const recusar = (r) => { const motivo = (recusa[r.id] || "").trim(); if (!motivo) return avisar("Escreva o motivo da recusa.", "warn");
    mudar((d) => { Object.assign(d.requisicoes.find((x) => x.id === r.id), { status: "Recusada", motivo, decididoEm: agora() }); }, `${r.num} recusada.`); };
  const escolherItem = (r, id) => mudar((d) => { d.requisicoes.find((x) => x.id === r.id).itemId = id; });

  return html`
  <section class="flex flex-wrap items-end justify-between gap-3">
    <div><p class="lbl m-0" style=${{ color: "rgb(var(--accent-ink))" }}>Formulário externo</p><h2 class="font-display text-3xl font-bold m-0">Requisições pendentes</h2>
      <p class="m-0 text-sm text-muted max-w-2xl">Pedidos antecipados que chegam pelo formulário. Confira, aprove e o estoque baixa sozinho com o destino e o operador.</p></div>
    <div class="flex flex-wrap gap-2"><button class="btn btn-ghost" onClick=${() => irPara("integracao")}><${Ic} n="PlugZap" size=${16} /> Conectar formulário</button>
      <button class="btn" onClick=${simular}><${Ic} n="Send" size=${16} /> Simular recebimento de formulário</button></div>
  </section>
  ${pend.length ? html`<div class="grid gap-4" style=${{ gridTemplateColumns: "repeat(auto-fill, minmax(min(100%, 360px), 1fr))" }}>
    ${pend.map((r) => { const c = checarRequisicao(db, r); return html`<article key=${r.id} class="card overflow-hidden flex flex-col" style=${{ borderTop: `4px solid rgb(var(${c.ok ? "--good" : "--warn"}))` }}>
      <div class="px-4 pt-4 pb-3 flex flex-col gap-1">
        <div class="flex items-center justify-between gap-2"><span class="font-mono font-semibold text-sm px-2 py-0.5 rounded bg-surface2 border border-line">${r.num}</span>
          <span class=${"chip " + (c.ok ? "chip-ok" : "chip-warn")}>${c.ok ? "Pronta para aprovar" : "Precisa de atenção"}</span></div>

function Operadores({ db, mudar, setConfirmar }) {
  const [editar, setEditar] = useState(null);
  const [filtro, setFiltro] = useState("");
  const retiradas = useMemo(() => { const c = {}; db.movs.forEach((m) => { if (m.operadorId && m.tipo === "Saída") { c[m.operadorId] = c[m.operadorId] || { n: 0, v: 0 }; c[m.operadorId].n++; c[m.operadorId].v += m.valorTotal; } }); return c; }, [db.movs]);
  const lista = db.operadores.filter((o) => !filtro || o.status === filtro);
  const alternar = (o) => mudar((d) => { const x = d.operadores.find((y) => y.id === o.id); x.status = x.status === "Ativo" ? "Inativo" : "Ativo"; }, `${o.nome} agora está ${o.status === "Ativo" ? "inativo" : "ativo"}.`);
  const excluir = (o) => retiradas[o.id]
    ? setConfirmar({ titulo: "Operador com histórico", texto: `${o.nome} tem ${retiradas[o.id].n} retirada(s) no histórico. Para manter a auditoria, ele será marcado como inativo em vez de excluído.`, botao: "Marcar como inativo",
        acao: () => mudar((d) => { d.operadores.find((y) => y.id === o.id).status = "Inativo"; }, `${o.nome} marcado como inativo.`) })
    : setConfirmar({ titulo: "Excluir operador", perigo: true, botao: "Excluir", texto: `Excluir ${o.nome} (${o.matricula})?`, acao: () => mudar((d) => { d.operadores = d.operadores.filter((y) => y.id !== o.id); }, `${o.nome} excluído.`) });
  return html`
  <section class="flex flex-wrap items-end justify-between gap-3">
    <div><p class="lbl m-0" style=${{ color: "rgb(var(--accent-ink))" }}>Autorização</p><h2 class="font-display text-3xl font-bold m-0">Operadores autorizados</h2>
      <p class="m-0 text-sm text-muted max-w-2xl">Só operadores ativos podem ser vinculados às saídas e às requisições do formulário.</p></div>
    <div class="flex flex-wrap gap-2 items-center"><select class="inp w-auto" aria-label="Filtrar status" value=${filtro} onChange=${(e) => setFiltro(e.target.value)}><option value="">Todos</option><option>Ativo</option><option>Inativo</option></select>
      <button class="btn" onClick=${() => setEditar({})}><${Ic} n="Plus" size=${17} /> Novo operador</button></div>
  </section>
  <section class="card overflow-hidden">${lista.length ? html`<div class="scroll-x"><table class="grid-t">
    <thead><tr><th>Operador</th><th>Matrícula</th><th>Setor / cargo</th><th>Nível</th><th>Status</th><th class="r">Retiradas</th><th></th></tr></thead>
    <tbody>${lista.map((o) => html`<tr key=${o.id}>
      <td class="font-semibold">${o.nome}</td><td class="font-mono">${o.matricula}</td><td>${o.setor}<div class="text-xs text-muted">${o.cargo}</div></td>
      <td><span class=${"chip " + (o.nivel === "Gestor" ? "chip-info" : o.nivel === "Supervisor" ? "chip-warn" : "chip-plain")}>${o.nivel}</span></td>
      <td><button class=${"chip " + (o.status === "Ativo" ? "chip-ok" : "chip-bad")} style=${{ border: 0, cursor: "pointer" }} onClick=${() => alternar(o)} title="Clique para alternar">${o.status}</button></td>
      <td class="r num">${retiradas[o.id] ? html`${retiradas[o.id].n}<div class="text-xs text-muted">${brl(retiradas[o.id].v)}</div>` : "0"}</td>
      <td><div class="flex gap-1 justify-end"><button class="btn btn-ghost btn-sm" aria-label=${"Editar " + o.nome} onClick=${() => setEditar(o)}><${Ic} n="Pencil" size=${15} /></button>
        <button class="btn btn-ghost btn-sm" aria-label=${"Excluir " + o.nome} onClick=${() => excluir(o)}><${Ic} n="Trash2" size=${15} className="text-bad" /></button></div></td></tr>`)}</tbody></table></div>`
    : html`<${Vazio} icone="Users" texto="Nenhum operador com esse filtro." />`}</section>
  ${editar ? html`<${OperadorForm} op=${editar} db=${db} mudar=${mudar} fechar=${() => setEditar(null)} />` : null}`;
}
function OperadorForm({ op, db, mudar, fechar }) {
  const novo = !op.id;
  const [f, setF] = useState({ nome: op.nome || "", matricula: op.matricula || "", setor: op.setor || "", cargo: op.cargo || "", status: op.status || "Ativo", nivel: op.nivel || "Solicitante" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const rep = f.matricula.trim() && db.operadores.some((o) => o.id !== op.id && norm(o.matricula) === norm(f.matricula));
  const ok = f.nome.trim() && f.matricula.trim() && !rep && f.setor.trim();
  const enviar = (e) => { e.preventDefault(); if (!ok) return;
    const dados = { ...f, nome: f.nome.trim().toUpperCase(), matricula: f.matricula.trim().toUpperCase(), setor: f.setor.trim(), cargo: f.cargo.trim() };
    if (mudar((d) => { if (novo) d.operadores.push({ id: uid("o"), ...dados }); else Object.assign(d.operadores.find((x) => x.id === op.id), dados); }, `${dados.nome} ${novo ? "cadastrado" : "atualizado"}.`)) fechar(); };
  return html`<${Modal} titulo=${novo ? "Novo operador" : "Editar operador"} onClose=${fechar}>
    <form class="flex flex-col gap-4" onSubmit=${enviar} noValidate>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <${Campo} id="op-nome" rotulo="Nome"><input id="op-nome" class="inp" value=${f.nome} onInput=${set("nome")} autoFocus /><//>
        <${Campo} id="op-mat" rotulo="Matrícula / ID" erro=${rep && "Matrícula já cadastrada."} dica="É o que o operador digita no formulário."><input id="op-mat" class="inp font-mono" value=${f.matricula} onInput=${set("matricula")} placeholder="OP-005" /><//>
        <${Campo} id="op-setor" rotulo="Setor"><input id="op-setor" class="inp" list="lista-setores" value=${f.setor} onInput=${set("setor")} /><datalist id="lista-setores">${DESTINOS_BASE.concat("Almoxarifado").map((s) => html`<option key=${s} value=${s} />`)}</datalist><//>
        <${Campo} id="op-cargo" rotulo="Cargo"><input id="op-cargo" class="inp" value=${f.cargo} onInput=${set("cargo")} /><//>
        <${Campo} id="op-nivel" rotulo="Nível de permissão"><select id="op-nivel" class="inp" value=${f.nivel} onChange=${set("nivel")}>${NIVEIS.map((n) => html`<option key=${n}>${n}</option>`)}</select><//>
        <${Campo} id="op-st" rotulo="Status"><select id="op-st" class="inp" value=${f.status} onChange=${set("status")}><option>Ativo</option><option>Inativo</option></select><//>
      </div>
      <div class="flex justify-end gap-2"><button type="button" class="btn btn-ghost" onClick=${fechar}>Cancelar</button><button class="btn" disabled=${!ok}>${novo ? "Cadastrar" : "Salvar"}</button></div>
    </form><//>`;
}

const CAMPOS_FORM = [
  ["Matrícula do operador", "Resposta curta · obrigatória", "OP-002"],
  ["Item (SKU ou nome)", "Resposta curta ou lista suspensa · obrigatória", "CB-06"],
  ["Quantidade", "Resposta curta com validação: número maior que 0", "2"],
  ["Data e hora prevista para retirada", "Data e hora", "27/11/2026 08:00"],
  ["Destino", "Lista suspensa: Montagem, Manutenção, OPERADOR…", "Montagem"],
  ["Observação", "Parágrafo · opcional", "Linha 2"],
];
const APPS_SCRIPT = `// Google Forms > ⋮ > Editor de script. Cole, salve e crie o acionador
// "Ao enviar formulário" (relógio à esquerda > Adicionar acionador).
// Ele copia cada resposta para a aba "Requisicoes" com os nomes que o app reconhece.
