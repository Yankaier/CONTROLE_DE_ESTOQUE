<div id="app"><p class="gutter" style="padding-block: 40px; color: rgb(var(--muted))">Carregando o almoxarifado…</p></div>

<script>
/* Edição do .xlsx no navegador: mesmo módulo do app Movimentação do Almoxarifado (acrescenta linhas sem regravar o resto do arquivo) */
const XLSX_EDIT = (() => {
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xffffffff;
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  async function pipe(u8, stream) {
    const buf = await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer();
    return new Uint8Array(buf);
  }
  const inflate = (u8) => pipe(u8, new DecompressionStream('deflate-raw'));
  const deflate = (u8) => pipe(u8, new CompressionStream('deflate-raw'));

  function readZip(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Arquivo .xlsx inválido (fim do zip não encontrado)');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder();
    const entries = [];
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Diretório do zip corrompido');
      const e = {
        versionMade: dv.getUint16(p + 4, true),
        version: dv.getUint16(p + 6, true),
        flags: dv.getUint16(p + 8, true) & ~0x0008,
        method: dv.getUint16(p + 10, true),
        time: dv.getUint16(p + 12, true),
        date: dv.getUint16(p + 14, true),
        crc: dv.getUint32(p + 16, true),
        csize: dv.getUint32(p + 20, true),
        usize: dv.getUint32(p + 24, true),
      };
      const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      e.nameBytes = u8.slice(p + 46, p + 46 + nlen);
      e.name = dec.decode(e.nameBytes);
      const lnlen = dv.getUint16(lho + 26, true), lxlen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lxlen;
      e.data = u8.slice(start, start + e.csize);
      entries.push(e);
      p += 46 + nlen + xlen + clen;
    }
    return entries;
  }

  function writeZip(entries) {
    const parts = [];
    const central = [];
    let offset = 0;
    for (const e of entries) {
      const n = e.nameBytes;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, e.version, true); h.setUint16(6, e.flags, true);
      h.setUint16(8, e.method, true); h.setUint16(10, e.time, true); h.setUint16(12, e.date, true);
      h.setUint32(14, e.crc, true); h.setUint32(18, e.csize, true); h.setUint32(22, e.usize, true);
      h.setUint16(26, n.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), n, e.data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, e.versionMade, true); c.setUint16(6, e.version, true);
      c.setUint16(8, e.flags, true); c.setUint16(10, e.method, true); c.setUint16(12, e.time, true);
      c.setUint16(14, e.date, true); c.setUint32(16, e.crc, true); c.setUint32(20, e.csize, true);
      c.setUint32(24, e.usize, true); c.setUint16(28, n.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), n);
      offset += 30 + n.length + e.data.length;
    }
    const cdSize = central.reduce((s, a) => s + a.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    const all = [...parts, ...central, new Uint8Array(end.buffer)];
    const out = new Uint8Array(all.reduce((s, a) => s + a.length, 0));
    let o = 0;
    for (const a of all) { out.set(a, o); o += a.length; }
    return out;
  }

  async function getText(e) {
    const raw = e.method === 0 ? e.data : await inflate(e.data);
    return new TextDecoder().decode(raw);
  }
  async function setText(e, text) {
    const raw = new TextEncoder().encode(text);
    e.crc = crc32(raw); e.usize = raw.length;
    e.data = await deflate(raw); e.csize = e.data.length; e.method = 8;
  }

  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const COLS = 'ABCDEFGHIJKLMN'.split('');
  const STYLES = [35, 36, 37, 37, 37, 37, 38, 39, 40, 38, 38, 37, 37, 38];

  function excelSerial(isoDate) {
    const [y, m, d] = isoDate.split('-').map(Number);
    return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5);
  }

  function cellXml(col, r, value, style) {
    const ref = col + r;
    if (value === null || value === undefined || value === '') return `<c r="${ref}" s="${style}"/>`;
    if (typeof value === 'number') return `<c r="${ref}" s="${style}"><v>${value}</v></c>`;
    return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${esc(value)}</t></is></c>`;
  }

  // values: [dataISO, movim, estante, pt, caixa, sku, desc, lote, unid, solicitante, area, os, nf, obs]
  function rowXml(r, values) {
    const cells = values.map((v, i) => cellXml(COLS[i], r, i === 0 ? excelSerial(v) : v, STYLES[i]));
    return `<row r="${r}" spans="1:14" x14ac:dyDescent="0.3">${cells.join('')}</row>`;
  }

  function firstFreeRow(sheetXml) {
    const re = /<row r="(\d+)"[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
    let m, lastUsed = 4;
    while ((m = re.exec(sheetXml))) {
      const r = Number(m[1]);
      if (r < 5) continue;
      const inner = m[2] || '';
      const aCell = inner.match(new RegExp(`<c r="A${r}"[^>]*?(?:/>|>([\\s\\S]*?)</c>)`));
      if (aCell && aCell[1] && /<v>|<is>/.test(aCell[1])) lastUsed = r;
    }
    return lastUsed + 1;
  }

  // Acrescenta as linhas e devolve {bytes, rows: [números de linha usados]}
  async function appendMovements(xlsxBytes, movements) {
    const entries = readZip(xlsxBytes);
    const find = (n) => entries.find((e) => e.name === n);
    const sheet = find('xl/worksheets/sheet2.xml'), table = find('xl/tables/table1.xml'), wb = find('xl/workbook.xml');
    if (!sheet || !table || !wb) throw new Error('A planilha não tem a aba Movimentação no formato esperado');
    let sx = await getText(sheet), tx = await getText(table), wx = await getText(wb);
    if (!/name="movimentação"/.test(tx)) throw new Error('Tabela "movimentação" não encontrada');
    const refMatch = tx.match(/ref="A4:N(\d+)"/);
    let tableEnd = Number(refMatch[1]);
    let r = firstFreeRow(sx);
    const used = [];
    for (const vals of movements) {
      const xml = rowXml(r, vals);
      const existing = new RegExp(`<row r="${r}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`);
      if (existing.test(sx)) sx = sx.replace(existing, xml);
      else sx = sx.replace('</sheetData>', xml + '</sheetData>');
      used.push(r);
      r++;
    }
    const last = used[used.length - 1];
    if (last > tableEnd) {
      tableEnd = last;
      tx = tx.replace(/ref="A4:N\d+"/g, `ref="A4:N${tableEnd}"`);
      sx = sx.replace(/<dimension ref="([A-Z]+\d+):N\d+"\/>/, `<dimension ref="$1:N${tableEnd}"/>`);
      sx = sx.replace(/sqref="B5:B\d+"/, `sqref="B5:B${tableEnd}"`);
      await setText(table, tx);
    }
    await setText(sheet, sx);
    if (!/fullCalcOnLoad=/.test(wx)) {
      wx = wx.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>');
      await setText(wb, wx);
    }
    return { bytes: writeZip(entries), rows: used };
  }

  /* ---------- aba Contagem: novos itens ---------- */
  function colNum(c) { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
  function colName(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  const ENT = [], SAI = [];
  for (let n = colNum('H'); n <= colNum('BN'); n += 2) { ENT.push(colName(n)); SAI.push(colName(n + 1)); }

  function lastItemRow(sx) {
    const re = /<row r="(\d+)"[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
    let m, last = 4;
    while ((m = re.exec(sx))) {
      const r = Number(m[1]);
      if (r < 5 || !m[2]) continue;
      const f = m[2].match(new RegExp(`<c r="F${r}"[^>]*?>([\\s\\S]*?)</c>`));
      if (f && /<v>|<is>/.test(f[1])) last = r;
    }
    return last;
  }

  // vals: {estante, pt, caixa, sku, desc}
  function contagemRowXml(tpl, tplRow, r, vals) {
    let x = tpl.replace(new RegExp(`<row r="${tplRow}"`), `<row r="${r}"`)
      .replace(new RegExp(`r="([A-Z]+)${tplRow}"`, 'g'), `r="$1${r}"`)
      .replace(new RegExp(`Contagem!([A-Z]+)${tplRow}(?![0-9])`, 'g'), `Contagem!$1${r}`)
      .replace(/(<\/f>)<v>[^<]*<\/v>/g, '$1');
    const put = (col, value) => {
      const re = new RegExp(`<c r="${col}${r}"([^>]*?)(?:/>|>[\\s\\S]*?</c>)`);
      const m = x.match(re);
      const style = m && (m[1].match(/s="(\d+)"/) || [])[1];
      const sAttr = style ? ` s="${style}"` : '';
      const cell = typeof value === 'number'
        ? `<c r="${col}${r}"${sAttr}><v>${value}</v></c>`
        : `<c r="${col}${r}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${esc(value)}</t></is></c>`;
      x = m ? x.replace(re, cell) : x;
    };
    put('B', vals.estante); put('C', vals.pt); put('D', vals.caixa); put('E', vals.sku); put('F', vals.desc);
    const fcell = (col, formula) => {
      const re = new RegExp(`<c r="${col}${r}"([^>]*?)(?:/>|>[\\s\\S]*?</c>)`);
      const m = x.match(re);
      const style = m && (m[1].match(/s="(\d+)"/) || [])[1];
      const cell = `<c r="${col}${r}"${style ? ` s="${style}"` : ''}><f>${formula}</f></c>`;
      x = m ? x.replace(re, cell) : x;
    };
    fcell('BQ', ['G' + r, ...ENT.map((c) => c + r)].join('+'));
    fcell('BR', SAI.map((c) => c + r).join('+'));
    fcell('BS', `BQ${r}+BR${r}`);
    return x;
  }

  async function addItems(entries, items) {
    const sheet = entries.find((e) => e.name === 'xl/worksheets/sheet1.xml');
    if (!sheet) throw new Error('A planilha não tem a aba Contagem no formato esperado');
    let sx = await getText(sheet);
    const tplRow = lastItemRow(sx);
    const tm = sx.match(new RegExp(`<row r="${tplRow}"[^>]*>[\\s\\S]*?</row>`));
    if (!tm) throw new Error('Não encontrei a última linha de itens da Contagem');
    const used = [];
    let r = tplRow + 1;
    let insertXml = '';
    for (const it of items) { insertXml += contagemRowXml(tm[0], tplRow, r, it); used.push(r); r++; }
    const last = r - 1;
    // insere logo após a última linha de item (antes de qualquer linha posterior)
    const after = new RegExp(`(<row r="${tplRow}"[^>]*>[\\s\\S]*?</row>)`);
    sx = sx.replace(after, `$1${insertXml}`);
    const bump = (s, re, col) => s.replace(re, (all, a, n) => Number(n) < last ? all.replace(`${col}${n}`, `${col}${last}`) : all);
    sx = bump(sx, /<dimension ref="([A-Z]+\d+):BS(\d+)"/, 'BS');
    sx = bump(sx, /<autoFilter ref="(B4):BW(\d+)"/, 'BW');
    sx = bump(sx, /sqref="(H5):BO(\d+)"/, 'BO');
    await setText(sheet, sx);
    const wbE = entries.find((e) => e.name === 'xl/workbook.xml');
    let wx = await getText(wbE);
    const wx2 = wx.replace(/(<definedName name="_xlnm\._FilterDatabase" localSheetId="0"[^>]*>Contagem!\$B\$4:\$BW\$)(\d+)/, (all, a, nn) => Number(nn) < last ? a + last : all);
    if (wx2 !== wx) await setText(wbE, wx2);
    return used;
  }

  /* ---------- remover uma aba inteira (ex.: Divergências) ---------- */
  async function removeSheet(xlsxBytes, sheetName) {
    const entries = readZip(xlsxBytes);
    const find = (n) => entries.find((e) => e.name === n);
    const wb = find('xl/workbook.xml'), rels = find('xl/_rels/workbook.xml.rels'), ct = find('[Content_Types].xml');
    if (!wb || !rels) return xlsxBytes;
    let wx = await getText(wb);
    const sheets = [...wx.matchAll(/<sheet [^>]*?name="([^"]*)"[^>]*?r:id="([^"]+)"[^>]*\/>/g)];
    const idx = sheets.findIndex((m) => m[1].normalize('NFC') === sheetName.normalize('NFC'));
    if (idx < 0) return xlsxBytes;
    const rid = sheets[idx][2];
    let rx = await getText(rels);
    const rel = rx.match(new RegExp(`<Relationship [^>]*Id="${rid}"[^>]*/>`));
    const target = rel && (rel[0].match(/Target="([^"]+)"/) || [])[1];
    if (!target) return xlsxBytes;
    const path = 'xl/' + target.replace(/^\/?xl\//, '').replace(/^\//, '');
    // aba e seus arquivos próprios (rels da aba)
    const relPath = path.replace(/worksheets\/(sheet\d+\.xml)$/, 'worksheets/_rels/$1.rels');
    const keep = entries.filter((e) => e.name !== path && e.name !== relPath);
    rx = rx.replace(rel[0], '');
    await setText(rels, rx);
    wx = wx.replace(sheets[idx][0], '');
    // índices locais de nomes definidos
    wx = wx.replace(/<definedName([^>]*?) localSheetId="(\d+)"([^>]*)>([\s\S]*?)<\/definedName>/g, (all, a, n, b, t) => {
      n = Number(n);
      if (n === idx) return '';
      return n > idx ? `<definedName${a} localSheetId="${n - 1}"${b}>${t}</definedName>` : all;
    });
    wx = wx.replace(/<definedNames>\s*<\/definedNames>/, '');
    wx = wx.replace(/ activeTab="(\d+)"/, (all, n) => Number(n) >= sheets.length - 1 ? ' activeTab="0"' : all);
    await setText(wb, wx);
    if (ct) { let c = await getText(ct); c = c.replace(new RegExp(`<Override PartName="/${path.replace(/[.]/g, '\\.')}"[^>]*/>`), ''); await setText(ct, c); }
    const app = find('docProps/app.xml');
    if (app) {
      let a = await getText(app);
      const esc2 = sheetName.replace(/&/g, '&amp;');
      if (a.includes(`<vt:lpstr>${esc2}</vt:lpstr>`)) {
        a = a.replace(`<vt:lpstr>${esc2}</vt:lpstr>`, '')
          .replace(/(<TitlesOfParts><vt:vector size=")(\d+)/, (m, p, n) => p + (Number(n) - 1))
          .replace(/(<vt:lpstr>Planilhas<\/vt:lpstr><\/vt:variant><vt:variant><vt:i4>)(\d+)/, (m, p, n) => p + (Number(n) - 1))
          .replace(/(<vt:lpstr>Worksheets<\/vt:lpstr><\/vt:variant><vt:variant><vt:i4>)(\d+)/, (m, p, n) => p + (Number(n) - 1));
        await setText(app, a);
      }
    }
    return writeZip(keep);
  }

  /* ---------- aba Contagem: excluir linhas ---------- */
  const REF_RE = /(^|[^A-Za-z0-9_.\]\[#])(\$?)([A-Z]{1,3})(\$?)(\d+)(?![0-9A-Za-z_(\[])/g;
  // desloca referências de linha numa fórmula: fn(row, absoluta) -> nova linha ou null (#REF!)
  function mapRefs(f, fn) {
    // não mexe em textos entre aspas (&quot;...&quot; ou "...")
    const parts = f.split(/(&quot;[\s\S]*?&quot;|"[^"]*")/);
    return parts.map((p, i) => i % 2 ? p : p.replace(REF_RE, (all, pre, d1, col, d2, row) => {
      if (colNum(col) > 16384) return all;
      const n = fn(Number(row), !!d2);
      return n === null ? `${pre}#REF!` : `${pre}${d1}${col}${d2}${n}`;
    })).join('');
  }
  const shiftAfter = (x) => (row) => row > x ? row - 1 : row === x ? null : row;
  // transforma fórmulas compartilhadas em fórmulas normais (para poder apagar linhas com segurança)
  function unshare(sx) {
    const masters = {};
    sx.replace(/<c r="([A-Z]+)(\d+)"[^>]*>\s*<f([^>]*)>([^<]*)<\/f>/g, (all, col, row, attrs, text) => {
      if (/t="shared"/.test(attrs)) { const si = (attrs.match(/si="(\d+)"/) || [])[1]; if (si != null) masters[si] = { row: Number(row), text }; }
      return all;
    });
    sx = sx.replace(/(<c r="[A-Z]+\d+"[^>]*>\s*)<f([^>]*)>([^<]*)<\/f>/g, (all, head, attrs, text) => /t="shared"/.test(attrs) ? `${head}<f>${text}</f>` : all);
    sx = sx.replace(/(<c r="[A-Z]+(\d+)"[^>]*>\s*)<f([^>]*?)\/>/g, (all, head, row, attrs) => {
      const si = (attrs.match(/si="(\d+)"/) || [])[1];
      const m = masters[si];
      if (!/t="shared"/.test(attrs) || !m) return all;
      const off = Number(row) - m.row;
      return `${head}<f>${mapRefs(m.text, (r, abs) => abs ? r : r + off)}</f>`;
    });
    return sx;
  }
  function shiftRanges(val, x) {
    const out = [];
    for (const rg of val.split(' ')) {
      const m = rg.match(/^(\$?[A-Z]+\$?)(\d+)(?::(\$?[A-Z]+\$?)(\d+))?$/);
      if (!m) { out.push(rg); continue; }
      let r1 = Number(m[2]), r2 = m[4] ? Number(m[4]) : r1;
      if (r1 === x && r2 === x) continue;
      if (r1 > x) r1--;
      if (r2 >= x) r2--;
      out.push(m[3] ? `${m[1]}${r1}:${m[3]}${r2}` : `${m[1]}${r1}`);
    }
    return out.join(' ');
  }
  function deleteRowXml(sx, x) {
    sx = sx.replace(new RegExp(`<row r="${x}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`), '');
    sx = sx.replace(/<row r="(\d+)"([^>]*?)(\/>|>[\s\S]*?<\/row>)/g, (all, r, attrs, body) => {
      const n = Number(r);
      if (n <= x) return all;
      return `<row r="${n - 1}"${attrs}${body.replace(/ r="([A-Z]+)(\d+)"/g, (a, c, rr) => ` r="${c}${Number(rr) - 1}"`)}`;
    });
    const sh = shiftAfter(x);
    sx = sx.replace(/<f([^>]*)>([^<]*)<\/f>/g, (all, attrs, text) => `<f${attrs}>${mapRefs(text, sh)}</f>`);
    sx = sx.replace(/<formula>([^<]*)<\/formula>/g, (all, text) => `<formula>${mapRefs(text, sh)}</formula>`);
    sx = sx.replace(/ (ref|sqref|activeCell|topLeftCell)="([^"]*)"/g, (all, k, v) => ` ${k}="${shiftRanges(v, x)}"`);
    sx = sx.replace(/<mergeCell ref=""\/>|<conditionalFormatting sqref="">[\s\S]*?<\/conditionalFormatting>/g, '');
    return sx;
  }
  // rows: números de linha da Contagem a apagar
  async function removeItems(entries, rows) {
    const sheet = entries.find((e) => e.name === 'xl/worksheets/sheet1.xml');
    if (!sheet) throw new Error('A planilha não tem a aba Contagem no formato esperado');
    let sx = unshare(await getText(sheet));
    let numeros = rows.filter((r) => typeof r === 'number');
    const chaves = rows.filter((r) => r && typeof r === 'object');
    if (chaves.length) {
      const alvo = new Set(chaves.map((k) => movKey(k.estante, k.pt, k.caixa, k.sku, k.desc)));
      const sst = await sharedStrings(entries);
      for (const m of sx.matchAll(/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)) {
        const r = Number(m[1]);
        if (r < 5) continue;
        const k = movKey(cellValue(m[2], 'B' + r, sst), cellValue(m[2], 'C' + r, sst), cellValue(m[2], 'D' + r, sst), cellValue(m[2], 'E' + r, sst), cellValue(m[2], 'F' + r, sst));
        if (alvo.has(k)) numeros.push(r);
      }
    }
    const lista = [...new Set(numeros.map(Number))].filter((r) => r >= 5).sort((a, b) => b - a);
    for (const x of lista) {
      const rm = sx.match(new RegExp(`<row r="${x}"[^>]*>[\\s\\S]*?</row>`));
      if (!rm || !new RegExp(`<c r="F${x}"`).test(rm[0])) throw new Error(`Linha ${x} da Contagem não encontrada`);
      sx = deleteRowXml(sx, x);
    }
    await setText(sheet, sx);
    const wbE = entries.find((e) => e.name === 'xl/workbook.xml');
    let wx = await getText(wbE);
    for (const x of lista) {
      wx = wx.replace(/(<definedName[^>]*>)([^<]*)(<\/definedName>)/g, (all, a, t, b) => /^'?Contagem'?!/.test(t) ? a + t.replace(/\$(\d+)/g, (m, n) => '$' + (Number(n) > x ? Number(n) - 1 : n)) + b : all);
    }
    await setText(wbE, wx);
    // outras abas que citem células da Contagem
    for (const e of entries.filter((e) => /^xl\/worksheets\/sheet\d+\.xml$/.test(e.name) && e !== sheet)) {
      const t = await getText(e);
      if (!/Contagem!/.test(t)) continue;
      let t2 = t;
      for (const x of lista) t2 = t2.replace(/Contagem!(\$?[A-Z]+\$?\d+(?::\$?[A-Z]+\$?\d+)?)/g, (all, ref) => 'Contagem!' + mapRefs(ref, shiftAfter(x)));
      if (t2 !== t) await setText(e, t2);
    }
    return lista;
  }

  /* ---------- aba Movimentação: apagar todas as linhas de um item ---------- */
  const xmlUnesc = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  async function sharedStrings(entries) {
    const e = entries.find((x) => x.name === 'xl/sharedStrings.xml');
    if (!e) return [];
    const t = await getText(e);
    return [...t.matchAll(/<si>([\s\S]*?)<\/si>/g)].map((m) => xmlUnesc([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((x) => x[1]).join('')));
  }
  function cellValue(rowXml, ref, sst) {
    const m = rowXml.match(new RegExp(`<c r="${ref}"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)`));
    if (!m || !m[2]) return '';
    if (/t="s"/.test(m[1])) { const v = (m[2].match(/<v>([^<]*)<\/v>/) || [])[1]; return v == null ? '' : (sst[Number(v)] ?? ''); }
    if (/t="inlineStr"/.test(m[1])) return xmlUnesc([...m[2].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((x) => x[1]).join(''));
    return xmlUnesc((m[2].match(/<v>([^<]*)<\/v>/) || [])[1] || '');
  }
  const keyNorm = (v) => String(v ?? '').normalize('NFC').trim().toUpperCase();
  const movKey = (e, p, c, s, d) => [e, p, c, s, d].map(keyNorm).join('|');
  // keys: [{estante, pt, caixa, sku, desc}] -> devolve as linhas apagadas (números antigos)
  async function removeMovementsByKey(entries, keys, extraRows = []) {
    const sheet = entries.find((e) => e.name === 'xl/worksheets/sheet2.xml');
    const table = entries.find((e) => e.name === 'xl/tables/table1.xml');
    if (!sheet || !table) throw new Error('A planilha não tem a aba Movimentação no formato esperado');
    const alvo = new Set(keys.map((k) => movKey(k.estante, k.pt, k.caixa, k.sku, k.desc)));
    const sst = await sharedStrings(entries);
    let sx = await getText(sheet);
    const linhas = [];
    for (const m of sx.matchAll(/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)) {
      const r = Number(m[1]);
      if (r < 5) continue;
      const k = movKey(cellValue(m[2], 'C' + r, sst), cellValue(m[2], 'D' + r, sst), cellValue(m[2], 'E' + r, sst), cellValue(m[2], 'F' + r, sst), cellValue(m[2], 'G' + r, sst));
      if (alvo.has(k)) linhas.push(r);
    }
    for (const r of extraRows) if (!linhas.includes(Number(r))) linhas.push(Number(r));
    if (!linhas.length) return [];
    let tx = await getText(table);
    for (const x of [...linhas].sort((a, b) => b - a)) {
      sx = deleteRowXml(sx, x);
      tx = tx.replace(/ ref="([^"]*)"/g, (all, v) => ` ref="${shiftRanges(v, x)}"`);
    }
    await setText(sheet, sx);
    await setText(table, tx);
    return linhas;
  }

  /* ---------- corrigir cadastro: estante, PT, caixa, nome e seriais de um item já na planilha ---------- */
  const numOuTexto = (v) => (typeof v === 'number' ? v : (/^\d+$/.test(String(v ?? '').trim()) ? Number(String(v).trim()) : (v ?? '')));
  function trocarCelula(rowXml, col, r, value) {
    const ref = col + r;
    const re = new RegExp(`<c r="${ref}"([^>]*?)(?:/>|>[\\s\\S]*?</c>)`);
    const m = rowXml.match(re);
    if (m) {
      const s = (m[1].match(/\bs="(\d+)"/) || [])[1] || '0';
      return rowXml.replace(re, cellXml(col, r, value, s));
    }
    // célula ausente: insere na ordem das colunas
    const novo = cellXml(col, r, value, '0');
    const alvo = colNum(col);
    let feito = false;
    const out = rowXml.replace(/<c r="([A-Z]+)\d+"/g, (all, c) => { if (!feito && colNum(c) > alvo) { feito = true; return novo + all; } return all; });
    return feito ? out : out + novo;
  }
  // list: [{ de: {estante, pt, caixa, sku, desc}, para: {estante, pt, caixa, desc}, seriais: {velho: novo} }]
  async function corrigirCadastros(entries, list) {
    if (!list.length) return { contagem: 0, movimentacao: 0 };
    const sst = await sharedStrings(entries);
    const porChave = new Map(list.map((c) => [movKey(c.de.estante, c.de.pt, c.de.caixa, c.de.sku, c.de.desc), c]));
    let nCont = 0, nMov = 0;
    const s1 = entries.find((e) => e.name === 'xl/worksheets/sheet1.xml');
    if (s1) {
      let sx = await getText(s1);
      sx = sx.replace(/<row r="(\d+)"((?:[^>\/]|\/(?!>))*)>([\s\S]*?)<\/row>/g, (all, rs, attrs, body) => {
        const r = Number(rs);
        if (r < 5) return all;
        const v = (c) => cellValue(body, c + r, sst);
        const c = porChave.get(movKey(v('B'), v('C'), v('D'), v('E'), v('F')));
        if (!c) return all;
        nCont++;
        let b = body;
        b = trocarCelula(b, 'B', r, numOuTexto(c.para.estante));
        b = trocarCelula(b, 'C', r, numOuTexto(c.para.pt));
        b = trocarCelula(b, 'D', r, numOuTexto(c.para.caixa));
        b = trocarCelula(b, 'F', r, String(c.para.desc));
        if (c.para.sku != null) b = trocarCelula(b, 'E', r, numOuTexto(c.para.sku));
        return `<row r="${rs}"${attrs}>${b}</row>`;
      });
      await setText(s1, sx);
    }
    const s2 = entries.find((e) => e.name === 'xl/worksheets/sheet2.xml');
    if (s2) {
      let sx = await getText(s2);
      sx = sx.replace(/<row r="(\d+)"((?:[^>\/]|\/(?!>))*)>([\s\S]*?)<\/row>/g, (all, rs, attrs, body) => {
        const r = Number(rs);
        if (r < 5) return all;
        const v = (c) => cellValue(body, c + r, sst);
        const c = porChave.get(movKey(v('C'), v('D'), v('E'), v('F'), v('G')));
        if (!c) return all;
        nMov++;
        let b = body;
        b = trocarCelula(b, 'C', r, numOuTexto(c.para.estante));
        b = trocarCelula(b, 'D', r, numOuTexto(c.para.pt));
        b = trocarCelula(b, 'E', r, numOuTexto(c.para.caixa));
        b = trocarCelula(b, 'G', r, String(c.para.desc));
        if (c.para.sku != null) b = trocarCelula(b, 'F', r, numOuTexto(c.para.sku));
        const ser = c.seriais || {}, lote = String(v('H')).trim();
        if (lote && Object.prototype.hasOwnProperty.call(ser, lote)) b = trocarCelula(b, 'H', r, ser[lote]);
        return `<row r="${rs}"${attrs}>${b}</row>`;
      });
      await setText(s2, sx);
    }
    const wb = entries.find((e) => e.name === 'xl/workbook.xml');
    let wx = await getText(wb);
    if (!/fullCalcOnLoad=/.test(wx)) { wx = wx.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>'); await setText(wb, wx); }
    return { contagem: nCont, movimentacao: nMov };
  }

  /* ---------- aba Contagem sempre em ordem de estante, prateleira e caixa ---------- */
  function chaveOrdem(v) {
    const txt = (x) => String(x ?? '').trim().toUpperCase();
    const num = (x) => { const n = Number(String(x).replace(',', '.')); return Number.isFinite(n) ? n : null; };
    const e = txt(v.e), p = txt(v.p), c = txt(v.c);
    // estante: números primeiro (1, 2 … 16), depois nomes (SUP), por último sem local (-)
    const eGrupo = e === '' || e === '-' ? 2 : (num(e) != null ? 0 : 1);
    const pNum = /^P(\d+)$/.exec(p);
    const pGrupo = p === '' || p === '-' ? 2 : (pNum ? 0 : 1);
    const cGrupo = c === '' || c === '-' ? 0 : (num(c) != null ? 1 : 2);
    return [eGrupo, eGrupo === 0 ? num(e) : 0, e, pGrupo, pNum ? Number(pNum[1]) : 0, p, cGrupo, cGrupo === 1 ? num(c) : 0, c, txt(v.d)];
  }
  function compararChaves(a, b) {
    for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; }
    return 0;
  }
  async function ordenarContagem(entries) {
    const s1 = entries.find((e) => e.name === 'xl/worksheets/sheet1.xml');
    if (!s1) return false;
    const sst = await sharedStrings(entries);
    let sx = await getText(s1);
    const ini = sx.indexOf('<sheetData>'), fim = sx.indexOf('</sheetData>');
    if (ini < 0 || fim < 0) return false;
    const corpo = sx.slice(ini + 11, fim);
    const linhas = [...corpo.matchAll(/<row r="(\d+)"((?:[^>\/]|\/(?!>))*)>([\s\S]*?)<\/row>|<row r="(\d+)"[^>]*\/>/g)];
    const cab = [], dados = [];
    for (const m of linhas) {
      const r = Number(m[1] || m[4]);
      if (r < 5 || !m[1]) { cab.push({ r, xml: m[0] }); continue; }
      const v = (c) => cellValue(m[3], c + r, sst);
      if (String(v('F')).trim() === '') { cab.push({ r, xml: m[0] }); continue; }
      dados.push({ r, attrs: m[2], body: m[3], k: chaveOrdem({ e: v('B'), p: v('C'), c: v('D'), d: v('F') }) });
    }
    if (!dados.length) return false;
    const linhasDados = dados.map((d) => d.r).sort((a, b) => a - b);
    const ordenado = dados.slice().sort((a, b) => compararChaves(a.k, b.k) || a.r - b.r);
    if (ordenado.every((d, i) => d.r === linhasDados[i])) return false; // já está em ordem
    const novas = ordenado.map((d, i) => {
      const nova = linhasDados[i];
      if (nova === d.r) return { r: nova, xml: `<row r="${nova}"${d.attrs}>${d.body}</row>` };
      let body = d.body.replace(new RegExp(`(<c r="[A-Z]+)${d.r}"`, 'g'), `$1${nova}"`);
      body = body.replace(/<f([^>]*)>([\s\S]*?)<\/f>/g, (all, at, f) => `<f${at}>${f.replace(new RegExp(`(^|[^A-Za-z$\\d_])([A-Z]{1,3})${d.r}(?!\\d)`, 'g'), `$1$2${nova}`)}</f>`);
      return { r: nova, xml: `<row r="${nova}"${d.attrs}>${body}</row>` };
    });
    const todas = cab.concat(novas).sort((a, b) => a.r - b.r);
    sx = sx.slice(0, ini + 11) + todas.map((x) => x.xml).join('') + sx.slice(fim);
    await setText(s1, sx);
    return true;
  }

  // ficha do item: todas as linhas da Movimentação de um item (por estante, PT, caixa, SKU e descrição)
  async function readMovements(xlsxBytes, key) {
    const entries = readZip(xlsxBytes);
    const sheet = entries.find((e) => e.name === 'xl/worksheets/sheet2.xml');
    if (!sheet) return [];
    const sst = await sharedStrings(entries);
    const sx = await getText(sheet);
    const alvo = key ? movKey(key.estante, key.pt, key.caixa, key.sku, key.desc) : null;
    const out = [];
    for (const m of sx.matchAll(/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)) {
      const r = Number(m[1]);
      if (r < 5) continue;
      const v = (c) => cellValue(m[2], c + r, sst);
      if (alvo && movKey(v('C'), v('D'), v('E'), v('F'), v('G')) !== alvo) continue;
      if (!alvo && !v('G')) continue;
      out.push({ row: r, estante: v('C'), pt: v('D'), caixa: v('E'), sku: v('F'), desc: v('G'), data: v('A'), movim: v('B'), lote: v('H'), unid: Number(v('I')) || 0, solicitante: v('J'), area: v('K'), os: v('L'), nf: v('M'), obs: v('N') });
    }
    return out;
  }

  // Aplica novos itens (Contagem) e movimentações (Movimentação) num só arquivo.
  // Reescreve linhas já existentes da Movimentação: [{row, values}]
  async function rewriteRows(xlsxBytes, list) {
    const entries = readZip(xlsxBytes);
    const sheet = entries.find((e) => e.name === 'xl/worksheets/sheet2.xml');
    let sx = await getText(sheet);
    for (const { row, values } of list) {
      const re = new RegExp(`<row r="${row}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`);
      if (!re.test(sx)) throw new Error(`Linha ${row} da Movimentação não encontrada`);
      sx = sx.replace(re, rowXml(row, values));
    }
    await setText(sheet, sx);
    const wb = entries.find((e) => e.name === 'xl/workbook.xml');
    let wx = await getText(wb);
    if (!/fullCalcOnLoad=/.test(wx)) { wx = wx.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>'); await setText(wb, wx); }
    return writeZip(entries);
  }

  async function applyChanges(xlsxBytes, { items = [], movements = [], descartes = null, ajustes = [], remover = [], removerMov = [], tirarLinhas = [], cadastros = [] }) {
    let bytes = xlsxBytes, itemRows = [], rows = [], movRemovidas = [], corrigidos = null;
    if (cadastros.length) { const entries = readZip(bytes); corrigidos = await corrigirCadastros(entries, cadastros); bytes = writeZip(entries); }
    if (ajustes.length) bytes = await rewriteRows(bytes, ajustes);
    if (remover.length || removerMov.length || tirarLinhas.length) {
      const entries = readZip(bytes);
      if (remover.length) await removeItems(entries, remover);
      if (removerMov.length || tirarLinhas.length) movRemovidas = await removeMovementsByKey(entries, removerMov, tirarLinhas);
      const wb = entries.find((e) => e.name === 'xl/workbook.xml');
      let wx = await getText(wb);
      if (!/fullCalcOnLoad=/.test(wx)) { wx = wx.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>'); await setText(wb, wx); }
      bytes = writeZip(entries);
    }
    if (items.length) {
      const entries = readZip(bytes);
      itemRows = await addItems(entries, items);
      const wb = entries.find((e) => e.name === 'xl/workbook.xml');
      let wx = await getText(wb);
      if (!/fullCalcOnLoad=/.test(wx)) { wx = wx.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>'); await setText(wb, wx); }
      bytes = writeZip(entries);
    }
    if (movements.length) {
      const out = await appendMovements(bytes, movements);
      bytes = out.bytes; rows = out.rows;
    }
    // descartes: função (rows) => records, chamada depois das movimentações para saber as linhas da baixa
    if (descartes) bytes = await writeDescartes(bytes, descartes(rows));
    try { const entries = readZip(bytes); if (await ordenarContagem(entries)) bytes = writeZip(entries); } catch (e) { console.warn('ordenar Contagem', e); }
    return { bytes, itemRows, rows, movRemovidas, corrigidos };
  }

  /* ---------- aba DESCARTES ---------- */
  const DESC_HEAD = ['Nº', 'Data', 'SKU', 'Material', 'Serial / Lote', 'Qtd', 'Local de origem', 'Motivo', 'Destino', 'Responsável', 'Autorizado por', 'Documento / Laudo', 'Baixa no estoque', 'Observação'];
  const DESC_W = [9, 11, 9, 38, 30, 6, 22, 16, 22, 18, 18, 20, 26, 40];
  const DESC_S = [37, 35, 37, 38, 39, 37, 38, 38, 38, 38, 38, 38, 38, 38];

  async function sheetPathByName(entries, name) {
    const wb = await getText(entries.find((e) => e.name === 'xl/workbook.xml'));
    const rels = await getText(entries.find((e) => e.name === 'xl/_rels/workbook.xml.rels'));
    const sheets = [...wb.matchAll(/<sheet [^>]*?name="([^"]+)"[^>]*?r:id="([^"]+)"[^>]*\/>/g)];
    const idx = sheets.findIndex((m) => m[1] === name);
    if (idx < 0) return null;
    const rid = sheets[idx][2];
    const rel = rels.match(new RegExp(`<Relationship [^>]*Id="${rid}"[^>]*Target="([^"]+)"`)) || rels.match(new RegExp(`<Relationship [^>]*Target="([^"]+)"[^>]*Id="${rid}"`));
    if (!rel) return null;
    return { path: 'xl/' + rel[1].replace(/^\/?xl\//, ''), index: idx };
  }

  // records: [{num, data (ISO ou ''), sku, material, serial, qtd, origem, motivo, destino, responsavel, autorizado, documento, baixa, obs}]
  async function writeDescartes(xlsxBytes, records) {
    const entries = readZip(xlsxBytes);
    const found = await sheetPathByName(entries, 'DESCARTES');
    if (!found) throw new Error('A planilha não tem a aba DESCARTES');
    const sheet = entries.find((e) => e.name === found.path);
    const old = await getText(sheet);
    const head = old.match(/^[\s\S]*?<worksheet[^>]*>/)[0];
    const n = records.length + 1;
    const rowsXml = [];
    rowsXml.push(`<row r="1" spans="1:14" ht="30" customHeight="1">${DESC_HEAD.map((h, i) => cellXml(colName(i + 1), 1, h, 41)).join('')}</row>`);
    records.forEach((d, k) => {
      const r = k + 2;
      const vals = [d.num, d.data ? excelSerial(d.data) : '-', d.sku ?? '-', d.material, d.serial || '-', Number(d.qtd) || 0, d.origem || '-', d.motivo || '-', d.destino || '-', d.responsavel || '-', d.autorizado || '-', d.documento || '-', d.baixa || '-', d.obs || ''];
      rowsXml.push(`<row r="${r}" spans="1:14">${vals.map((v, i) => cellXml(colName(i + 1), r, v, DESC_S[i])).join('')}</row>`);
    });
    const cols = DESC_W.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
    const xml = `${head}<dimension ref="A1:N${n}"/><sheetViews><sheetView showGridLines="0" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="14.4" x14ac:dyDescent="0.3"/><cols>${cols}</cols><sheetData>${rowsXml.join('')}</sheetData><autoFilter ref="A1:N${n}"/><pageMargins left="0.511811024" right="0.511811024" top="0.787401575" bottom="0.787401575" header="0.31496062" footer="0.31496062"/></worksheet>`;
    await setText(sheet, xml);
    const wbE = entries.find((e) => e.name === 'xl/workbook.xml');
    let wx = await getText(wbE);
    const dn = `<definedName name="_xlnm._FilterDatabase" localSheetId="${found.index}" hidden="1">DESCARTES!$A$1:$N$${n}</definedName>`;
    const reDn = new RegExp(`<definedName name="_xlnm\\._FilterDatabase" localSheetId="${found.index}"[^>]*>[^<]*</definedName>`);
    if (reDn.test(wx)) wx = wx.replace(reDn, dn);
    else if (/<definedNames>/.test(wx)) wx = wx.replace('<definedNames>', '<definedNames>' + dn);
    else wx = wx.replace('</sheets>', '</sheets><definedNames>' + dn + '</definedNames>');
    await setText(wbE, wx);
    return writeZip(entries);
  }


  /* ---------- travas para quem usa a planilha direto no Excel ----------
     Movimentação: listas e conferências na digitação + linha vermelha quando algo está errado.
     Contagem e DESCARTES: abas protegidas (sem senha), só o formulário escreve nelas.
     Pasta de trabalho: estrutura travada (não dá para apagar, renomear ou mover abas). */
  const ERRO_DXF = '<dxf><font><b/><color rgb="FF9C0006"/></font><fill><patternFill><bgColor rgb="FFFFC7CE"/></patternFill></fill></dxf>';
  const xmlEsc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const itemExiste = (r) => `COUNTIFS(Contagem!$B$5:$B$5000,$C${r},Contagem!$C$5:$C$5000,$D${r},Contagem!$D$5:$D$5000,$E${r},Contagem!$E$5:$E$5000,$F${r},Contagem!$F$5:$F$5000,$G${r})`;
  const formulaErro = (r) => `AND($G${r}<>"",OR(AND($B${r}<>"Entrada",$B${r}<>"Saída",$B${r}<>"Saldo Inicial"),AND($B${r}="Saída",N($I${r})>=0),AND($B${r}="Entrada",N($I${r})<=0),AND(COUNTBLANK($C${r}:$G${r})=0,${itemExiste(r)}=0),AND($H${r}<>"",$H${r}<>"-",ABS(N($I${r}))<>1),NOT(ISNUMBER($A${r}))))`;
  const PROT = '<sheetProtection sheet="1" objects="1" scenarios="1" formatColumns="0" formatRows="0" autoFilter="0"/>';
  const AVISO_DXF = '<dxf><font><color rgb="FF7F6000"/></font><fill><patternFill><bgColor rgb="FFFFEB9C"/></patternFill></fill></dxf>';
  const PREENCHER = 10; // linhas vazias que já vão com o preenchimento automático
  const nDesc = (r) => `COUNTIF(Contagem!$F$5:$F$5000,$G${r})`;
  // Estante, PT, Caixa e SKU vêm da Contagem pela descrição (só quando a descrição é de um único lugar)
  const fBusca = (r, col) => `IF(OR($G${r}="",${nDesc(r)}<>1),"",INDEX(Contagem!$${col}$5:$${col}$5000,MATCH($G${r},Contagem!$F$5:$F$5000,0)))`;
  function linhaPreenchida(r) {
    const c = (col, st, f) => f ? `<c r="${col}${r}" s="${st}" t="str"><f>${xmlEsc(f)}</f></c>` : `<c r="${col}${r}" s="${st}"/>`;
    const cells = [
      c('A', STYLES[0]), c('B', STYLES[1]),
      c('C', STYLES[2], fBusca(r, 'B')), c('D', STYLES[3], fBusca(r, 'C')), c('E', STYLES[4], fBusca(r, 'D')), c('F', STYLES[5], fBusca(r, 'E')),
      c('G', STYLES[6]), c('H', STYLES[7], `IF($G${r}="","","-")`), c('I', STYLES[8]), c('J', STYLES[9]),
      c('K', STYLES[10], `IF($G${r}="","",IF($B${r}="Entrada","ESTOQUE",""))`), c('L', STYLES[11], `IF($G${r}="","","0000/00")`),
      c('M', STYLES[12], `IF($G${r}="","","-")`), c('N', STYLES[13])
    ];
    return `<row r="${r}" spans="1:14" x14ac:dyDescent="0.3">${cells.join('')}</row>`;
  }
  // tira as linhas vazias do fim e põe linhas prontas (com fórmulas) para quem lança direto no Excel
  function preencherLinhasVazias(x) {
    let uso = 4;
    for (const m of x.matchAll(/<row r="(\d+)"[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)) if (/<v>[^<]+<\/v>|<is>/.test(m[2] || '')) uso = Math.max(uso, Number(m[1]));
    x = x.replace(/<row r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g, (m0, r) => (Number(r) > uso ? '' : m0));
    let novas = '';
    for (let r = uso + 1; r <= uso + PREENCHER; r++) novas += linhaPreenchida(r);
    if (/<sheetData\/>/.test(x)) x = x.replace('<sheetData/>', `<sheetData>${novas}</sheetData>`);
    else x = x.replace('</sheetData>', novas + '</sheetData>');
    return { x, uso };
  }
  function validacoesMov() {
    const dv = (attrs, f1) => `<dataValidation ${attrs}>${f1 != null ? `<formula1>${xmlEsc(f1)}</formula1>` : ''}</dataValidation>`;
    const msg = (titulo, texto) => `promptTitle="${xmlEsc(titulo)}" prompt="${xmlEsc(texto)}"`;
    const err = (titulo, texto) => `errorStyle="stop" errorTitle="${xmlEsc(titulo)}" error="${xmlEsc(texto)}"`;
    const L = 20000;
    const lista = [
      dv(`type="date" operator="greaterThan" allowBlank="1" showInputMessage="1" showErrorMessage="1" ${err('Data inválida', 'Digite a data assim: 23/11/2026.')} ${msg('Data', 'Dia do movimento, ex.: 23/11/2026.')} sqref="A5:A${L}"`, '36526'),
      dv(`type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" ${err('Movimento inválido', 'Escolha Entrada ou Saída na lista.')} ${msg('Movimento', 'Escolha Entrada ou Saída.')} sqref="B5:B${L}"`, '"Entrada,Saída"'),
      dv(`type="custom" allowBlank="1" showInputMessage="1" showErrorMessage="1" ${err('Item não encontrado', 'Não existe item com essa Estante, PT, Caixa, SKU e Descrição. Copie esses 5 campos de uma linha do mesmo item ou confira na aba Contagem. Item novo: cadastre pelo formulário.')} ${msg('Item', 'Copie Estante, PT, Nº Caixa, SKU e Descrição de uma linha que já existe do mesmo item.')} sqref="C5:F${L}"`, `OR(COUNTBLANK($C5:$G5)>0,${itemExiste(5)}>0)`),
      dv(`type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" ${err('Item não encontrado', 'Escolha a descrição na lista (setinha da célula). Item que não está na lista ainda não foi cadastrado: fale com o almoxarifado.')} ${msg('Descrição', 'Escolha o item na lista. Estante, PT, Caixa e SKU se preenchem sozinhos. Se ficarem amarelos, o item existe em mais de um lugar: digite o local certo.')} sqref="G5:G${L}"`, 'Contagem!$F$5:$F$5000'),
      dv(`type="custom" allowBlank="1" showInputMessage="1" showErrorMessage="1" ${err('Serial', 'Com serial, é um serial por linha e a quantidade é 1 (entrada) ou -1 (saída).')} ${msg('Serial / lote', 'Um serial por linha. Sem serial, deixe -')} sqref="H5:H${L}"`, 'OR($H5="",$H5="-",$I5="",ABS(N($I5))=1)'),
      dv(`type="custom" allowBlank="1" showInputMessage="1" showErrorMessage="1" ${err('Quantidade', 'Entrada: número positivo (ex.: 2). Saída: número negativo (ex.: -2). Com serial: 1 ou -1. Escolha o Movimento (coluna B) antes.')} ${msg('Quantidade', 'Entrada positiva (2). Saída negativa (-2). Com serial: 1 ou -1.')} sqref="I5:I${L}"`, 'AND(ISNUMBER($I5),$I5<>0,IF($B5="Saída",$I5<0,$I5>0),OR($H5="",$H5="-",ABS($I5)=1))'),
      dv(`allowBlank="1" showInputMessage="1" ${msg('Quem', 'Saída: quem retirou. Entrada: quem trouxe ou o fornecedor.')} sqref="J5:J${L}"`),
      dv(`allowBlank="1" showInputMessage="1" ${msg('Área', 'Saída: setor de destino (MONTAGEM, MANUTENÇÃO...). Entrada: ESTOQUE.')} sqref="K5:K${L}"`)
    ];
    return `<dataValidations count="${lista.length}">${lista.join('')}</dataValidations>`;
  }
  function protegerAba(xml) {
    if (/<sheetProtection\b/.test(xml)) return xml;
    if (/<\/sheetCalcPr>|<sheetCalcPr[^>]*\/>/.test(xml)) return xml.replace(/(<sheetCalcPr[^>]*\/>|<\/sheetCalcPr>)/, '$1' + PROT);
    if (/<sheetData\/>/.test(xml)) return xml.replace('<sheetData/>', '<sheetData/>' + PROT);
    return xml.replace('</sheetData>', '</sheetData>' + PROT);
  }
  async function protegerPlanilha(xlsxBytes) {
    const entries = readZip(xlsxBytes);
    // estilo vermelho de erro
    const st = entries.find((e) => e.name === 'xl/styles.xml');
    let sx = await getText(st), dxfId;
    const md = sx.match(/<dxfs\b[^>]*>([\s\S]*?)<\/dxfs>/);
    if (md) {
      const lista = [...md[1].matchAll(/<dxf>[\s\S]*?<\/dxf>|<dxf\/>/g)].map((x) => x[0]);
      dxfId = lista.indexOf(ERRO_DXF);
      if (dxfId < 0) { dxfId = lista.length; sx = sx.replace(md[0], `<dxfs count="${lista.length + 1}">${md[1]}${ERRO_DXF}</dxfs>`); await setText(st, sx); }
    } else {
      dxfId = 0;
      sx = /<dxfs\b[^>]*\/>/.test(sx) ? sx.replace(/<dxfs\b[^>]*\/>/, `<dxfs count="1">${ERRO_DXF}</dxfs>`) : sx.replace('</cellStyles>', `</cellStyles><dxfs count="1">${ERRO_DXF}</dxfs>`);
      await setText(st, sx);
    }
    // amarelo de "confira": item com a mesma descrição em mais de um lugar
    let avisoId;
    {
      let sy = await getText(st);
      const m2 = sy.match(/<dxfs\b[^>]*>([\s\S]*?)<\/dxfs>/);
      const lista = [...m2[1].matchAll(/<dxf>[\s\S]*?<\/dxf>|<dxf\/>/g)].map((q) => q[0]);
      avisoId = lista.indexOf(AVISO_DXF);
      if (avisoId < 0) { avisoId = lista.length; sy = sy.replace(m2[0], `<dxfs count="${lista.length + 1}">${m2[1]}${AVISO_DXF}</dxfs>`); await setText(st, sy); }
    }
    // Movimentação
    const mov = await sheetPathByName(entries, 'Movimentação');
    if (mov) {
      const e = entries.find((x) => x.name === mov.path);
      let x = await getText(e);
      let ultima = 4;
      for (const m of x.matchAll(/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)) if (/<v>[^<]+<\/v>|<is>/.test(m[2])) ultima = Math.max(ultima, Number(m[1]));
      x = preencherLinhasVazias(x).x;
      const cfs = [...x.matchAll(/<conditionalFormatting\b[\s\S]*?<\/conditionalFormatting>/g)].map((m) => m[0]).filter((b) => !b.includes('COUNTIFS(Contagem!$B$5:$B$5000') && !b.includes('COUNTIF(Contagem!$F$5:$F$5000'));
      x = x.replace(/<conditionalFormatting\b[\s\S]*?<\/conditionalFormatting>/g, '').replace(/<dataValidations\b[\s\S]*?<\/dataValidations>/g, '');
      const r0 = ultima + 1;
      const nossa = `<conditionalFormatting sqref="A${r0}:N20000"><cfRule type="expression" dxfId="${dxfId}" priority="1" stopIfTrue="1"><formula>${xmlEsc(formulaErro(r0))}</formula></cfRule></conditionalFormatting>`
        + `<conditionalFormatting sqref="C${r0}:F20000"><cfRule type="expression" dxfId="${avisoId}" priority="2"><formula>${xmlEsc(`AND($G${r0}<>"",${nDesc(r0)}>1,COUNTBLANK($C${r0}:$F${r0})>0)`)}</formula></cfRule></conditionalFormatting>`;
      let p = 1;
      const blocos = [nossa, ...cfs].join('').replace(/priority="\d+"/g, () => `priority="${p++}"`);
      const ins = blocos + validacoesMov();
      const m = x.match(/<(hyperlinks|printOptions|pageMargins|pageSetup|headerFooter|rowBreaks|colBreaks|customProperties|cellWatches|ignoredErrors|smartTags|drawing|legacyDrawing|picture|oleObjects|controls|webPublishItems|tableParts|extLst)\b/);
      x = m ? x.slice(0, m.index) + ins + x.slice(m.index) : x.replace('</worksheet>', ins + '</worksheet>');
      await setText(e, x);
    }
    for (const nome of ['Contagem', 'DESCARTES']) {
      const f = await sheetPathByName(entries, nome);
      if (!f) continue;
      const e = entries.find((x) => x.name === f.path);
      await setText(e, protegerAba(await getText(e)));
    }
    // Contagem: azul só para número maior que zero (célula ainda sem cálculo não pinta)
    const cont = await sheetPathByName(entries, 'Contagem');
    if (cont) {
      const e = entries.find((x) => x.name === cont.path);
      let x = await getText(e);
      const y = x.replace(/<cfRule type="cellIs" dxfId="(\d+)" priority="(\d+)" operator="greaterThan"><formula>0<\/formula><\/cfRule>/g, (m, d, p) => `<cfRule type="expression" dxfId="${d}" priority="${p}"><formula>AND(ISNUMBER(H5),H5&gt;0)</formula></cfRule>`)
        .replace(/<cfRule type="cellIs" dxfId="(\d+)" priority="(\d+)" operator="lessThan"><formula>0<\/formula><\/cfRule>/g, (m, d, p) => `<cfRule type="expression" dxfId="${d}" priority="${p}"><formula>AND(ISNUMBER(H5),H5&lt;0)</formula></cfRule>`);
      if (y !== x) await setText(e, y);
    }
    const wbE = entries.find((e) => e.name === 'xl/workbook.xml');
    let wx = await getText(wbE);
    // sempre recalcular ao abrir: o formulário grava fórmulas sem o resultado pronto
    if (/<calcPr\b[^>]*fullCalcOnLoad=/.test(wx)) wx = wx.replace(/fullCalcOnLoad="[^"]*"/, 'fullCalcOnLoad="1"');
    else if (/<calcPr\b/.test(wx)) wx = wx.replace(/<calcPr\b/, '<calcPr fullCalcOnLoad="1"');
    else wx = wx.replace(/<\/workbook>/, '<calcPr fullCalcOnLoad="1"/></workbook>');
    await setText(wbE, wx);
    if (!/<workbookProtection\b/.test(wx)) {
      wx = /<bookViews>/.test(wx) ? wx.replace('<bookViews>', '<workbookProtection lockStructure="1"/><bookViews>') : wx.replace('<sheets>', '<workbookProtection lockStructure="1"/><sheets>');
      await setText(wbE, wx);
    }
    return writeZip(entries);
  }

  function toBase64(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function fromBase64(b64) {
    const s = atob(b64.trim());
    const u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  }

  return { getText, setText, protegerPlanilha, ordenarContagem, corrigirCadastros, readMovements, removeSheet, appendMovements, applyChanges, writeDescartes, rewriteRows, toBase64, fromBase64, readZip, writeZip, crc32, firstFreeRow };
})();
if (typeof module !== 'undefined') module.exports = XLSX_EDIT;

</script>
<script>
"use strict";
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);
const L = window.LucideReact || {};
function Ic({ n, size = 18, className = "" }) {
  const C = L[n];
  return C ? html`<${C} size=${size} strokeWidth=${2} className=${className} aria-hidden="true" />` : null;
}

/* ================= utilidades ================= */
const CHAVE = "almoxarifado.gestao.v1";
const UNIDADES = ["un", "pct", "cx", "kg", "m", "L", "rolo", "par", "jg"];
const NIVEIS = ["Solicitante", "Supervisor", "Gestor"];
const DESTINOS_BASE = ["Montagem", "Manutenção", "OPERADOR", "Fornecedor", "Descarte"];
const brl = (n) => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const qtdFmt = (n) => (Number(n) || 0).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
const dataHora = (iso) => { const d = new Date(iso); return isNaN(d) ? String(iso || "") : d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); };
const agora = () => new Date().toISOString();
const uid = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const num = (v) => { const s = String(v ?? "").trim().replace(/\s/g, ""); if (!s) return NaN; return Number(/,\d{1,3}$/.test(s) ? s.replace(/\./g, "").replace(",", ".") : s.replace(",", ".")); };
const statusItem = (it) => (it.qtd <= 0 ? "Esgotado" : it.minimo > 0 && it.qtd <= it.minimo ? "Baixo" : "Normal");
const CHIP_STATUS = { Normal: "chip-ok", Baixo: "chip-warn", Esgotado: "chip-bad" };
const isoLocal = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 16); };

/* ================= regras de negócio ================= */
function aplicarMov(db, d, semValidar) {
  const it = db.itens.find((x) => x.id === d.itemId);
  if (!it) throw new Error("Item não encontrado.");
  const q = Number(d.qtd);
  if (!(q > 0) && d.tipo !== "Ajuste") throw new Error("A quantidade precisa ser maior que zero.");
  if (d.tipo === "Saída") {
    if (!semValidar && q > it.qtd) throw new Error(`Saldo insuficiente: há ${qtdFmt(it.qtd)} ${it.unidade} de ${it.nome}.`);
    if (!d.estorno) {
      if (!String(d.destino || "").trim()) throw new Error("Informe o destino do material.");
      if (!d.operador) throw new Error("Escolha o operador responsável.");
      if (d.operador.status !== "Ativo") throw new Error(`${d.operador.nome} está inativo e não pode retirar material.`);
    }
  }
  if (d.tipo === "Entrada" && d.novoValor != null && !isNaN(d.novoValor) && d.novoValor >= 0) {
    it.valor = d.modoValor === "substituir" ? d.novoValor
      : (it.qtd > 0 ? (it.qtd * it.valor + q * d.novoValor) / (it.qtd + q) : d.novoValor);
    it.valor = Math.round(it.valor * 10000) / 10000;
  }
  const delta = d.tipo === "Saída" ? -q : q;
  const lotes = separarLotes(d.lote);
  if (lotes.length && d.tipo !== "Ajuste") {
    const atuais = it.seriais || [];
    it.seriais = d.tipo === "Saída" ? atuais.filter((x) => !lotes.some((l) => norm(l) === norm(x))) : [...atuais, ...lotes.filter((l) => !atuais.some((x) => norm(x) === norm(l)))];
  }
  it.qtd = Math.round((it.qtd + delta) * 1000) / 1000;
  db.seq.mov = Math.max(db.seq.mov || 0, ...db.movs.map((x) => x.n || 0)) + 1;
  const m = {
    id: uid("m"), n: db.seq.mov, tipo: d.tipo, itemId: it.id, sku: it.sku, nome: it.nome, unidade: it.unidade,
    qtd: d.tipo === "Ajuste" ? q : Math.abs(q), valorUnit: it.valor, valorTotal: Math.abs(q) * it.valor,
    destino: d.tipo === "Saída" ? String(d.destino || "").trim() : (d.destino || ""),
    operadorId: d.operador?.id || "", operadorNome: d.operador?.nome || "", operadorMatricula: d.operador?.matricula || "",
    nf: d.nf || "", os: d.os || "", lote: d.lote || "", obs: d.obs || "", origem: d.origem || "Manual", dataHora: d.dataHora || agora(), saldoApos: it.qtd,
  };
  db.movs.push(m);
  return m;
}

function novaRequisicao(db, r) {
  db.seq.req = Math.max(db.seq.req || 0, ...db.requisicoes.map((x) => parseInt(String(x.num).replace(/\D/g, ""), 10) || 0)) + 1;
  const q = { id: uid("r"), num: "R-" + String(db.seq.req).padStart(4, "0"), recebidaEm: r.recebidaEm || agora(), matricula: String(r.matricula || "").trim(),
    item: String(r.item || "").trim(), itemId: "", qtd: num(r.qtd), previsto: r.previsto || "", destino: String(r.destino || "").trim(), obs: String(r.obs || "").trim(),
    fonte: r.fonte || "Formulário", chave: r.chave || "", status: "Pendente", motivo: "", movId: "", decididoEm: "" };
  db.requisicoes.push(q);
  return q;
}

function acharItem(db, texto) {
  const t = norm(texto);
  if (!t) return null;
  return db.itens.find((i) => norm(i.sku) === t) || db.itens.find((i) => norm(i.nome) === t)
    || (() => { const p = db.itens.filter((i) => norm(i.nome).includes(t) || t.includes(norm(i.sku))); return p.length === 1 ? p[0] : null; })();
}
function acharOperador(db, texto) {
  const t = norm(texto);
  return t ? db.operadores.find((o) => norm(o.matricula) === t) || db.operadores.find((o) => norm(o.nome) === t) || null : null;
}
function checarRequisicao(db, r) {
  const op = acharOperador(db, r.matricula);
  const it = r.itemId ? db.itens.find((i) => i.id === r.itemId) : acharItem(db, r.item);
  const checks = [
    { ok: !!op && op.status === "Ativo", txt: !op ? `Operador "${r.matricula || "?"}" não está cadastrado` : op.status !== "Ativo" ? `${op.nome} está inativo` : `Operador autorizado: ${op.nome} (${op.matricula}, ${op.nivel})` },
    { ok: !!it, txt: it ? `Item: ${it.nome} (${it.sku})` : `Item "${r.item || "?"}" não encontrado no cadastro`, semItem: !it },
    { ok: r.qtd > 0, txt: r.qtd > 0 ? `Quantidade: ${qtdFmt(r.qtd)}${it ? " " + it.unidade : ""}` : "Quantidade inválida" },
    { ok: !!it && r.qtd > 0 && r.qtd <= it.qtd, txt: !it ? "Disponibilidade: escolha o item primeiro" : r.qtd <= it.qtd ? `Disponível: ${qtdFmt(it.qtd)} ${it.unidade} (fica ${qtdFmt(it.qtd - r.qtd)})` : `Saldo insuficiente: só há ${qtdFmt(it.qtd)} ${it.unidade}` },
    { ok: !!r.destino, txt: r.destino ? `Destino: ${r.destino}` : "Destino não informado" },
  ];
  return { op, it, checks, ok: checks.every((c) => c.ok) };
}

/* grava no banco só o que mudou entre dois estados */
async function gravarDiferencas(banco, antes, depois) {
  const tarefas = [];
  for (const col of COLS) {
    const a = new Map(antes[col].map((x) => [x.id, x]));
    const d = new Map(depois[col].map((x) => [x.id, x]));
    for (const [id, x] of d) { const v = a.get(id); if (!v || JSON.stringify(v) !== JSON.stringify(x)) tarefas.push(() => banco.collection(col).doc(id).set(semId(x))); }
    for (const id of a.keys()) if (!d.has(id)) tarefas.push(() => banco.collection(col).doc(id).delete());
  }
  if (JSON.stringify(configDoc(antes)) !== JSON.stringify(configDoc(depois))) tarefas.push(() => banco.doc("config/geral").set(configDoc(depois)));
  for (let k = 0; k < tarefas.length; k += 20) await Promise.all(tarefas.slice(k, k + 20).map((t) => t()));
  return tarefas.length;
}
function erroBanco(e) {
  const c = e && e.code;
  if (c === "invalid_argument") return "Você não tem permissão para alterar estes dados (peça acesso de Colaborador ao dono).";
  if (c === "quota_exceeded") return "O banco de dados chegou ao limite. Exporte um backup e apague movimentações antigas.";
  if (c === "resource_exhausted") return "Muitas gravações ao mesmo tempo. Espere alguns segundos e tente de novo.";
  return "Não consegui salvar no banco agora. Confira a internet e tente de novo.";
}

  if (m.origem === "Cadastro") { movim = "Saldo Inicial"; solic = "CARGA INICIAL"; area = "ESTOQUE INICIAL"; }
  else if (m.tipo === "Entrada") { movim = "Entrada"; area = "ESTOQUE"; }
  else if (m.tipo === "Saída") { movim = "Saída"; area = areaSaida(m.destino); sinal = -1; }
  else if (Number(m.qtd) >= 0) { movim = "Entrada"; solic = "INVENTÁRIO"; area = "ESTOQUE"; }
  else { movim = "Saída"; solic = "INVENTÁRIO"; area = "AJUSTE DE INVENTÁRIO"; sinal = -1; }
  const obs = [m.tipo === "Ajuste" ? "Ajuste de contagem" : "", m.obs].filter(Boolean).join(" · ");

/* as mesmas linhas, para mostrar e copiar (data dd/mm/aaaa, unid com sinal) */
const linhasPlanilha = (db, movs) => movs.flatMap((m) => linhasXlsx(db, m)).map((r) => [r[0] ? dataBR(r[0] + "T12:00") : "", ...r.slice(1, 8), (r[8] > 0 ? "+" : "") + String(r[8]).replace(".", ","), ...r.slice(9)]);

/* o que ainda não está na planilha: movimentações depois do último nº enviado e itens criados aqui */

function textosDe(o, acc = []) {

function acharTamanho(o, itemId) {

const espera = (ms) => new Promise((r) => setTimeout(r, ms));

/* tamanho do arquivo no SharePoint: muda quando alguém grava a planilha por fora do site */

function dataISO(t) {

  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if (/^\d+(\.\d+)?$/.test(t)) return new Date(Date.UTC(1899, 11, 30) + Math.round(Number(t)) * 86400000).toISOString().slice(0, 10);

function csvLinhas(texto) {
  const t = String(texto).replace(/^﻿/, "");
  const primeira = t.split(/\r?\n/)[0] || "";
  const sep = (primeira.match(/;/g) || []).length > (primeira.match(/,/g) || []).length ? ";" : (primeira.includes("\t") ? "\t" : ",");
  const out = []; let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(cell); out.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); out.push(row); }
  return out.filter((r) => r.some((c) => String(c).trim()));
}
function paraCsv(linhas) {
  const q = (v) => { const s = String(v ?? ""); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return "﻿" + linhas.map((r) => r.map(q).join(";")).join("\r\n");
}

function mapearCabecalho(cab) {

    else if (idx.matricula == null && /(matricula|id do operador|operador|codigo do operador)/.test(n)) idx.matricula = i;
    else if (idx.item == null && /(item|sku|material|produto)/.test(n)) idx.item = i;
    else if (idx.qtd == null && /(quant|qtd)/.test(n)) idx.qtd = i;
    else if (idx.previsto == null && /(previst|retirada|data e hora|horario)/.test(n)) idx.previsto = i;
